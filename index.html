<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Super Mario Bros - PSP Edition</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a1a;display:grid;place-items:center;min-height:100vh;font-family:'Courier New',monospace;overflow:hidden}
#wrap{position:relative;width:min(960px,100vw);padding:10px}
#gameContainer{position:relative;background:#000;border:4px solid #2a2a4a;border-radius:12px;box-shadow:0 0 60px rgba(0,100,255,0.15)}
canvas{display:block;width:100%;image-rendering:pixelated;background:#5c94fc}
#controls{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:10px 20px;background:rgba(10,10,26,0.95);border-radius:10px;border:2px solid #2a2a4a}
#controls kbd{background:#1a1a3a;color:#4fc3f7;padding:6px 14px;border-radius:6px;font-size:13px;border:2px solid #3a3a5a;font-weight:bold}
#controls span{color:#666;font-size:13px}
#status{color:#4fc3f7;font-weight:bold;font-size:14px;text-shadow:0 0 10px rgba(79,195,247,0.3)}
#status span{color:#ffd700}
</style>
</head>
<body>
<div id="wrap">
<div id="gameContainer">
<canvas id="game" width="960" height="480"></canvas>
</div>
<div id="controls">
<div>
<kbd>←</kbd> <kbd>→</kbd> 
<span style="color:#555;margin:0 6px;">|</span>
<kbd>↑</kbd> <kbd>Z</kbd> Lompat
<span style="color:#555;margin:0 6px;">|</span>
<kbd>R</kbd> Restart
</div>
<div id="status">❤️ <span id="livesDisplay">3</span> | 🪙 <span id="coinDisplay">0</span> | 🏆 <span id="scoreDisplay">0</span> | 🌟 <span id="stageDisplay">1-1</span></div>
</div>
</div>

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 960, H = 480;

// Keys
const keys = {};
document.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        ],

            {x:460, y:392},
            {x:500, y:392},
            {x:660, y:392},

// Game state
let currentStage = 0;
let player = {};
let enemies = [];
let coins = [];
let platforms = [];
let flag = {};
let camera = {x:0};
let gameOver = false;
let winScreen = false;
let frameCount = 0;
let deathTimer = 0;
let stageTransition = 0;

function loadStage(index) {
    const stage = stages[index];
    platforms = stage.platforms.map(p => ({...p}));
    enemies = stage.enemies.map(e => ({
        ...e,
        alive: true,
        vx: (Math.random() > 0.5 ? 1 : -1) * (0.8 + Math.random() * 0.8),
        vy: 0,
        onGround: false
    }));
    coins = stage.coins.map(c => ({...c, collected: false}));
    flag = {...stage.flag};
    
    player = {
        x: 40,
        y: 390,
        w: 26,
        h: 32,
        vx: 0,
        vy: 0,
        onGround: false,
        facing: 1,
        frame: 0,
        frameTimer: 0,
        invincible: 0,
        dead: false
    };
    
    camera.x = 0;
    gameOver = false;
    winScreen = false;
    deathTimer = 0;
    stageTransition = 0;
    document.getElementById('stageDisplay').textContent = stage.name;
    updateUI();
}

function resetGame() {
    currentStage = 0;
    player.lives = 3;
    player.coins = 0;
    player.score = 0;
    loadStage(currentStage);
}

function updateUI() {
    document.getElementById('livesDisplay').textContent = player.lives || 3;
    document.getElementById('coinDisplay').textContent = player.coins || 0;
    document.getElementById('scoreDisplay').textContent = player.score || 0;
}

function rectCollide(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
}

function update() {
    frameCount++;
    
    if(gameOver) {
        if(keys['r']) resetGame();
        return;
    }
    
    if(winScreen) {
        stageTransition++;
        if(stageTransition > 120) {
            currentStage++;
            if(currentStage >= stages.length) {
                currentStage = 0;
                player.score += 5000;
                updateUI();
            }
            loadStage(currentStage);
        }
        return;
    }
    
    if(player.dead) {
        deathTimer++;
        if(deathTimer > 60) {
            if(player.lives > 0) {
                loadStage(currentStage);
                player.lives--;
                updateUI();
            } else {
                gameOver = true;
            }
        }
        return;
    }
    
    // Player movement
    let moveX = 0;
    if(keys['arrowleft']) moveX = -1;
    if(keys['arrowright']) moveX = 1;
    
    if(moveX !== 0) {
        player.vx += moveX * 0.5;
        if(Math.abs(player.vx) > MAX_SPEED) {
            player.vx = moveX * MAX_SPEED;
        }
        player.facing = moveX;
        
        // Animation
        if(player.onGround) {
            player.frameTimer++;
            if(player.frameTimer > 6) {
                player.frameTimer = 0;
                player.frame = (player.frame + 1) % 4;
            }
        }
    } else {
        player.vx *= FRICTION;
        if(Math.abs(player.vx) < 0.1) player.vx = 0;
        if(player.onGround) {
            player.frame = 0;
            player.frameTimer = 0;
        }
    }
    
    // Jump
    if((keys['z'] || keys['arrowup']) && player.onGround) {
        player.vy = JUMP_FORCE;
        player.onGround = false;
    }
    
    // Variable jump height
    if(!keys['z'] && !keys['arrowup'] && player.vy < -2) {
        player.vy *= 0.85;
    }
    
    // Gravity
    player.vy += GRAVITY;
    if(player.vy > 12) player.vy = 12;
    
    // Move X with collision
    player.x += player.vx;
    for(const p of platforms) {
        if(rectCollide(player, p)) {
            if(player.vx > 0) {
                player.x = p.x - player.w;
            } else if(player.vx < 0) {
                player.x = p.x + p.w;
            }
            player.vx = 0;
        }
    }
    
    // Move Y with collision
    player.y += player.vy;
    player.onGround = false;
    
    for(const p of platforms) {
        if(rectCollide(player, p)) {
            if(player.vy > 0) {
                player.y = p.y - player.h;
                player.vy = 0;
                player.onGround = true;
                
                // Question block hit from below
                if(p.type === 'question' && p.coin) {
                    p.coin = false;
                    player.coins++;
                    player.score += 200;
                    updateUI();
                }
            } else if(player.vy < 0) {
                player.y = p.y + p.h;
                player.vy = 0;
                // Hit brick from below
                if(p.type === 'brick') {
                    // Break brick (effect)
                }
            }
        }
    }
    
    // Collect coins
    for(const c of coins) {
        if(!c.collected) {
            const dist = Math.hypot(
                player.x + player.w/2 - c.x,
                player.y + player.h/2 - c.y
            );
            if(dist < 20) {
                c.collected = true;
                player.coins++;
                player.score += 100;
                updateUI();
            }
        }
    }
    
    // Update enemies
    for(const e of enemies) {
        if(!e.alive) continue;
        
        e.x += e.vx;
        
        // Enemy gravity
        e.vy += GRAVITY;
        e.y += e.vy;
        e.onGround = false;
        
        // Enemy collision with platforms
        for(const p of platforms) {
            if(rectCollide(e, p)) {
                if(e.vy > 0) {
                    e.y = p.y - e.h;
                    e.vy = 0;
                    e.onGround = true;
                } else if(e.vy < 0) {
                    e.y = p.y + p.h;
                    e.vy = 0;
                }
                if(e.vx > 0 && e.x + e.w > p.x && e.x < p.x) {
                    e.x = p.x - e.w;
                    e.vx *= -1;
                } else if(e.vx < 0 && e.x < p.x + p.w && e.x + e.w > p.x + p.w) {
                    e.x = p.x + p.w;
                    e.vx *= -1;
                }
            }
        }
        
        // Enemy vs player
        if(!player.invincible && !player.dead && rectCollide(player, e)) {
            if(player.vy > 0 && player.y + player.h - e.y < 30) {
                // Stomp enemy
                e.alive = false;
                player.vy = -8;
                player.score += 500;
                updateUI();
            } else {
                // Player hit
                player.dead = true;
                player.vy = -8;
                deathTimer = 0;
                player.lives--;
                updateUI();
            }
        }
    }
    
    // Flag pole
    if(!player.dead && 
       Math.abs(player.x + player.w/2 - flag.x) < 20 &&
       player.y + player.h > flag.y) {
        winScreen = true;
        player.score += 2000;
        updateUI();
    }
    
    // Fall off screen
    if(player.y > H + 50) {
        player.dead = true;
        player.lives--;
        updateUI();
        deathTimer = 0;
    }
    
    // Camera follow
    let targetCam = player.x - 400;
    if(targetCam < 0) targetCam = 0;
    if(targetCam > 500) targetCam = 500;
    camera.x += (targetCam - camera.x) * 0.08;
    
    // Invincibility timer
    if(player.invincible > 0) player.invincible--;
}

function draw() {
    ctx.clearRect(0, 0, W, H);
    
    // Sky gradient
    let skyGrad = ctx.createLinearGradient(0, 0, 0, H);
    skyGrad.addColorStop(0, '#5c94fc');
    skyGrad.addColorStop(0.6, '#88b0ff');
    skyGrad.addColorStop(1, '#aaccff');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);
    
    // Clouds
    const cloudPositions = [
        {x:100, y:50, s:1.5},
        {x:300, y:30, s:1.0},
        {x:500, y:60, s:1.8},
        {x:700, y:40, s:1.2},
        {x:900, y:55, s:1.4},
        {x:1200, y:35, s:1.1},
        {x:1400, y:60, s:1.6},
    ];
    
    for(const c of cloudPositions) {
        const cx = (c.x - camera.x * 0.2) % 2000;
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.beginPath();
        ctx.arc(cx - 30*c.s, c.y, 25*c.s, 0, Math.PI*2);
        ctx.arc(cx, c.y - 15*c.s, 30*c.s, 0, Math.PI*2);
        ctx.arc(cx + 30*c.s, c.y, 25*c.s, 0, Math.PI*2);
        ctx.fill();
    }
    
    // Draw platforms
    const drawX = (x) => x - camera.x;
    
    for(const p of platforms) {
        const dx = drawX(p.x);
        if(dx > -100 && dx < 1000) {
            if(p.type === 'ground') {
                // Grass top
                ctx.fillStyle = '#6aaa4a';
                ctx.fillRect(dx, p.y, p.w, 8);
                ctx.fillStyle = '#8a7a5a';
                ctx.fillRect(dx, p.y + 8, p.w, p.h - 8);
                // Grass blades
                ctx.fillStyle = '#5a9a3a';
                for(let i = 0; i < p.w; i += 6) {
                    ctx.fillRect(dx + i, p.y - 2, 2, 4);
                }
            } else if(p.type === 'brick') {
                ctx.fillStyle = '#c07a4a';
                ctx.fillRect(dx, p.y, p.w, p.h);
                ctx.strokeStyle = '#8a5a3a';
                ctx.lineWidth = 1;
                ctx.strokeRect(dx, p.y, p.w, p.h);
                // Brick pattern
                for(let i = 0; i < p.w; i += p.w/2) {
                    ctx.strokeRect(dx + i, p.y, p.w/2, p.h/2);
                    ctx.strokeRect(dx + i - p.w/4, p.y + p.h/2, p.w/2, p.h/2);
                }
            } else if(p.type === 'question') {
                const isCoin = p.coin;
                ctx.fillStyle = isCoin ? '#f0c040' : '#8a8a8a';
                ctx.fillRect(dx, p.y, p.w, p.h);
                ctx.strokeStyle = isCoin ? '#c09020' : '#666';
                ctx.lineWidth = 2;
                ctx.strokeRect(dx, p.y, p.w, p.h);
                if(isCoin) {
                    // Animated question mark
                    const pulse = Math.sin(frameCount * 0.08) * 2;
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 20px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('?', dx + p.w/2, p.y + p.h/2 + 7 + pulse/2);
                }
            } else if(p.type === 'platform') {
                ctx.fillStyle = '#8a7a5a';
                ctx.fillRect(dx, p.y, p.w, p.h);
                ctx.fillStyle = '#6a5a3a';
                ctx.fillRect(dx, p.y, p.w, 2);
                ctx.fillRect(dx, p.y + p.h - 2, p.w, 2);
            } else if(p.type === 'pipe') {
                // Pipe body
                ctx.fillStyle = '#2a8a2a';
                ctx.fillRect(dx - 2, p.y - 10, p.w + 4, 10);
                ctx.fillRect(dx, p.y, p.w, p.h);
                // Pipe highlights
                ctx.fillStyle = '#3aaa3a';
                ctx.fillRect(dx + 4, p.y - 6, p.w - 12, 3);
                ctx.fillRect(dx + 3, p.y + 4, p.w - 8, 3);
                ctx.fillRect(dx + 3, p.y + p.h - 8, p.w - 8, 3);
            }
        }
    }
    
    // Draw coins
    for(const c of coins) {
        if(!c.collected) {
            const dx = drawX(c.x);
            const scale = Math.abs(Math.sin(frameCount * 0.06 + c.x));
            // Glow
            ctx.shadowColor = '#f0c040';
            ctx.shadowBlur = 20;
            // Coin body
            ctx.fillStyle = '#f0c040';
            ctx.beginPath();
            ctx.ellipse(dx, c.y, 8 * scale + 2, 8, 0, 0, Math.PI*2);
            ctx.fill();
            // Inner detail
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.ellipse(dx, c.y, 4 * scale + 1, 4, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }
    
    // Draw enemies
    for(const e of enemies) {
        if(!e.alive) continue;
        const dx = drawX(e.x);
        if(dx > -50 && dx < 1000) {
            // Goomba body
            ctx.fillStyle = '#8a4a3a';
            ctx.beginPath();
            ctx.arc(dx + 14, e.y + 10, 14, Math.PI, 0);
            ctx.fill();
            ctx.fillRect(dx, e.y + 10, 28, 14);
            // Feet with walking animation
            ctx.fillStyle = '#4a2a1a';
            const footOff = Math.sin(frameCount * 0.12 + e.x) * 3;
            ctx.fillRect(dx + 2 + footOff, e.y + 22, 10, 6);
            ctx.fillRect(dx + 16 - footOff, e.y + 22, 10, 6);
            // Eyes
            ctx.fillStyle = '#fff';
            ctx.fillRect(dx + 6, e.y + 8, 6, 6);
            ctx.fillRect(dx + 16, e.y + 8, 6, 6);
            ctx.fillStyle = '#1a1a1a';
            const eyeDir = e.vx > 0 ? 2 : 0;
            ctx.fillRect(dx + 8 + eyeDir, e.y + 10, 2, 3);
            ctx.fillRect(dx + 18 + eyeDir, e.y + 10, 2, 3);
            // Angry eyebrows
            ctx.fillStyle = '#3a2a1a';
            ctx.fillRect(dx + 5, e.y + 6, 8, 2);
            ctx.fillRect(dx + 15, e.y + 6, 8, 2);
        }
    }
    
    // Draw flag
    const fdx = drawX(flag.x);
    ctx.fillStyle = '#888';
    ctx.fillRect(fdx, flag.y - 10, 4, flag.height + 10);
    // Flag pole top
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.arc(fdx + 2, flag.y - 10, 6, 0, Math.PI*2);
    ctx.fill();
    // Flag
    const wave = Math.sin(frameCount * 0.08) * 3;
    ctx.fillStyle = '#ff4444';
    ctx.beginPath();
    ctx.moveTo(fdx + 4, flag.y - 8);
    ctx.quadraticCurveTo(fdx + 25 + wave, flag.y + 5, fdx + 4, flag.y + 20);
    ctx.fill();
    // Star on flag
    ctx.fillStyle = '#fff';
    ctx.font = '14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('★', fdx + 14 + wave/2, flag.y + 8);
    // Flag pole base
    ctx.fillStyle = '#666';
    ctx.fillRect(fdx - 4, flag.y + flag.height - 4, 12, 8);
    
    // Draw player
    if(!player.dead && player.invincible % 4 < 2) {
        const dx = drawX(player.x);
        const dy = player.y;
        
        ctx.save();
        ctx.translate(dx + player.w/2, dy + player.h/2);
        if(player.facing < 0) ctx.scale(-1, 1);
        
        // Shadow
        ctx.shadowColor = 'rgba(0,0,0,0.2)';
        ctx.shadowBlur = 10;
        ctx.shadowOffsetY = 3;
        
        // Hat
        ctx.fillStyle = '#e03030';
        ctx.fillRect(-13, -18, 26, 6);
        ctx.fillRect(-9, -22, 18, 5);
        // Hat brim
        ctx.fillRect(-14, -15, 28, 3);
        
        // Face
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#f0c0a0';
        ctx.fillRect(-11, -12, 22, 14);
        
        // Hair/sideburns
        ctx.fillStyle = '#5a3a1a';
        ctx.fillRect(-13, -14, 3, 10);
        ctx.fillRect(10, -14, 3, 10);
        
        // Mustache
        ctx.fillStyle = '#5a3a1a';
        ctx.fillRect(-9, -5, 18, 3);
        // Mustache ends
        ctx.fillRect(-12, -5, 4, 4);
        ctx.fillRect(8, -5, 4, 4);
        
        // Eyes
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(-4, -9, 3, 3);
        ctx.fillRect(3, -9, 3, 3);
        // Eye shine
        ctx.fillStyle = '#fff';
        ctx.fillRect(-3, -9, 1, 1);
        ctx.fillRect(4, -9, 1, 1);
        
        // Body (overalls)
        ctx.fillStyle = '#e03030';
        ctx.fillRect(-11, 2, 22, 14);
        // Overall straps
        ctx.fillStyle = '#c02020';
        ctx.fillRect(-9, -2, 3, 8);
        ctx.fillRect(6, -2, 3, 8);
        // Buttons
        ctx.fillStyle = '#ffd700';
        ctx.fillRect(-8, 2, 2, 2);
        ctx.fillRect(6, 2, 2, 2);
        
        // Shoes
        ctx.fillStyle = '#5a3a1a';
        const walkOffset = player.onGround ? Math.sin(frameCount * 0.15 + (player.facing > 0 ? 0 : 1)) * 2 : 0;
        ctx.fillRect(-11 + walkOffset, 16, 10, 6);
        ctx.fillRect(1 - walkOffset, 16, 10, 6);
        // Shoe detail
        ctx.fillStyle = '#4a2a0a';
        ctx.fillRect(-11 + walkOffset, 18, 10, 2);
        ctx.fillRect(1 - walkOffset, 18, 10, 2);
        
        ctx.restore();
    }
    
    // UI overlay
    // Lives
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(10, 10, 160, 30);
    ctx.fillStyle = '#ff6b6b';
    ctx.font = '20px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`❤️ x${player.lives || 0}`, 18, 33);
    
    // Coins
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(180, 10, 120, 30);
    ctx.fillStyle = '#ffd700';
    ctx.fillText(`🪙 ${player.coins || 0}`, 188, 33);
    
    // Score
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(310, 10, 200, 30);
    ctx.fillStyle = '#fff';
    ctx.fillText(`🏆 ${player.score || 0}`, 318, 33);
    
    // Stage
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(W - 100, 10, 90, 30);
    ctx.fillStyle = '#4fc3f7';
    ctx.textAlign = 'right';
    ctx.fillText(`🌟 ${stages[currentStage].name}`, W - 18, 33);
    
    // Game over screen
    if(gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.85)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ff1744';
        ctx.font = 'bold 72px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', W/2, 210);
        ctx.fillStyle = '#fff';
        ctx.font = '28px monospace';
        ctx.fillText('Tekan R untuk restart', W/2, 270);
        ctx.fillStyle = '#888';
        ctx.font = '20px monospace';
        ctx.fillText(`Score: ${player.score || 0}`, W/2, 320);
    }
    
    // Win screen
    if(winScreen) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);
        
        const pulse = Math.sin(frameCount * 0.08) * 5;
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 64px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('🎉 STAGE CLEAR! 🎉', W/2, 190 + pulse/2);
        
        ctx.fillStyle = '#fff';
        ctx.font = '30px monospace';
        ctx.fillText(`Score: ${player.score || 0}`, W/2, 250);
        
        const nextStage = currentStage < stages.length - 1 ? 
            stages[currentStage + 1].name : '★ FINISH! ★';
        ctx.fillStyle = '#4fc3f7';
        ctx.font = '24px monospace';
        ctx.fillText(`Next: ${nextStage}`, W/2, 300);
        
        if(currentStage >= stages.length - 1) {
            ctx.fillStyle = '#ffd700';
            ctx.font = 'bold 36px monospace';
            ctx.fillText('🏆 YOU WIN THE GAME! 🏆', W/2, 360);
        }
        
        // Progress bar
        const progress = (stageTransition % 120) / 120;
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(W/2 - 200, 340, 400, 10);
        ctx.fillStyle = '#4fc3f7';
        ctx.fillRect(W/2 - 200, 340, 400 * progress, 10);
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

// Initialize
resetGame();
loop();
</script>
</body>
</html>
