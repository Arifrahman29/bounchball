<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bounce Classic Fan Game</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#222;font-family:monospace;color:#fff;display:grid;place-items:center;min-height:100vh}
#wrap{width:min(900px,100vw);padding:14px;text-align:center}canvas{width:100%;image-rendering:pixelated;border:8px solid #aaa;background:#d9e8c8;box-shadow:0 0 0 4px #333}
p{margin:10px 0 0;color:#ddd}kbd{background:#555;border-radius:4px;padding:2px 6px}
</style>
</head><body><div id="wrap">
<canvas id="game" width="800" height="480"></canvas>
<p><kbd>←</kbd> <kbd>→</kbd> bergerak · <kbd>↑</kbd> lompat · <kbd>R</kbd> ulang level</p>
</div>
<script>
const c=document.getElementById("game"),x=c.getContext("2d");
const W=c.width,H=c.height;
const keys={}; 
addEventListener("keydown",e=>{
    keys[e.key]=true;
    if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.key))e.preventDefault()
});
addEventListener("keyup",e=>keys[e.key]=false);

// Level - platform dengan posisi yang mirip Bounce Nokia
const level=[
    [0,440,800,40], // lantai dasar
    [70,360,150,22],
    [285,310,120,22],
    [460,365,180,22],
    [610,275,110,22],
    [120,230,100,22],
    [300,175,135,22],
    [510,125,190,22],
    [735,380,65,22]
];

const spikes=[
    [225,418,55],
    [650,418,70],
    [395,288,55],
    [720,253,55]
];

const rings=[
    [130,315],[185,315],
    [335,265],[385,265],
    [520,320],[575,320],
    [655,230],[170,185],
    [355,130],[400,130],
    [560,80],[625,80]
];

let ball, score, won, cam;
let frameCount = 0;

function reset(){
    // Parameter gerakan sangat lambat seperti Bounce Nokia
    ball = {
        x: 45,
        y: 400,
        r: 16,
        vx: 0,
        vy: 0,
        on: false,
        // Friction tinggi untuk gerakan lebih lambat
        friction: 0.92,
        // Kecepatan maksimum sangat rendah
        maxSpeed: 3.2,
        // Akselerasi sangat kecil
        acceleration: 0.25,
        // Gravitasi ringan
        gravity: 0.28,
        // Lompatan lebih rendah
        jumpPower: -7.0,
        targetVx: 0
    };
    score = 0;
    won = false;
    cam = 0;
    for(const r of rings) r[2] = false;
}

reset();

function rectHitCircle(b, r){
    let nx = Math.max(r[0], Math.min(b.x, r[0] + r[2]));
    let ny = Math.max(r[1], Math.min(b.y, r[1] + r[3]));
    let dx = b.x - nx, dy = b.y - ny;
    return dx*dx + dy*dy < b.r*b.r;
}

function update(){
    frameCount++;
    if(keys.r||keys.R){reset();keys.r=keys.R=false}
    if(won)return;

    // Gerakan horizontal yang sangat lambat
    let moveDir = 0;
    if(keys.ArrowLeft) moveDir = -1;
    if(keys.ArrowRight) moveDir = 1;

    // Akselerasi sangat bertahap
    if(moveDir !== 0) {
        ball.vx += moveDir * ball.acceleration;
        // Batasi kecepatan sangat rendah
        if(Math.abs(ball.vx) > ball.maxSpeed) {
            ball.vx = moveDir * ball.maxSpeed;
        }
    } else {
        // Perlambatan tinggi
        ball.vx *= ball.friction;
        if(Math.abs(ball.vx) < 0.03) ball.vx = 0;
    }

    // Lompatan - lebih rendah
    if(keys.ArrowUp && ball.on) {
        ball.vy = ball.jumpPower;
        ball.on = false;
    }

    // Gravitasi ringan
    ball.vy += ball.gravity;
    if(ball.vy > 8) ball.vy = 8;

    // Update posisi X
    ball.x += ball.vx;

    // Deteksi tabrakan horizontal
    for(const r of level){
        if(rectHitCircle(ball, r)){
            if(ball.vx > 0) {
                ball.x = r[0] - ball.r;
                ball.vx *= -0.15;
            } else if(ball.vx < 0) {
                ball.x = r[0] + r[2] + ball.r;
                ball.vx *= -0.15;
            }
        }
    }

    // Update posisi Y
    ball.y += ball.vy;
    ball.on = false;

    // Deteksi tabrakan vertikal
    for(const r of level){
        if(rectHitCircle(ball, r)){
            if(ball.vy > 0) {
                ball.y = r[1] - ball.r;
                ball.vy = 0;
                ball.on = true;
            } else if(ball.vy < 0) {
                ball.y = r[1] + r[3] + ball.r;
                ball.vy = 0;
            }
        }
    }

    // Deteksi duri
    for(const s of spikes){
        if(ball.x + ball.r > s[0] && ball.x - ball.r < s[0] + s[2] &&
           ball.y + ball.r > s[1] - 22 && ball.y - ball.r < s[1]) {
            reset();
        }
    }

    // Kumpulkan cincin
    for(const r of rings){
        if(!r[2] && Math.hypot(ball.x - r[0], ball.y - r[1]) < ball.r + 12) {
            r[2] = true;
            score++;
        }
    }

    // Cek finish
    if(ball.x > 765 && ball.y > 330 && score === rings.length) won = true;

    // Jatuh dari layar
    if(ball.y > H + 50) reset();
}

function draw(){
    x.clearRect(0,0,W,H);
    
    // Background gradien seperti Nokia
    let grad = x.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'#b8d4b0');
    grad.addColorStop(1,'#9bb892');
    x.fillStyle = grad;
    x.fillRect(0,0,W,H);
    
    // Texture subtle
    x.fillStyle = "rgba(0,0,0,0.03)";
    for(let i = 0; i < H; i += 3) {
        x.fillRect(0, i, W, 1);
    }

    // Gambar platform
    for(const r of level){
        // Shadow
        x.fillStyle = "rgba(0,0,0,0.15)";
        x.fillRect(r[0]+3, r[1]+3, r[2], r[3]);
        
        // Platform utama
        x.fillStyle = "#4a5a3a";
        x.fillRect(r[0], r[1], r[2], r[3]);
        
        // Highlight atas
        x.fillStyle = "#6a8a5a";
        x.fillRect(r[0], r[1], r[2], 3);
        
        // Texture garis
        x.fillStyle = "rgba(0,0,0,0.1)";
        for(let i = r[0] + 10; i < r[0] + r[2]; i += 20) {
            x.fillRect(i, r[1] + 5, 1, r[3] - 10);
        }
    }

    // Gambar duri
    for(const s of spikes){
        x.fillStyle = "#555";
        x.shadowColor = "rgba(0,0,0,0.2)";
        x.shadowBlur = 4;
        for(let i = s[0]; i < s[0] + s[2]; i += 14){
            x.beginPath();
            x.moveTo(i, s[1]);
            x.lineTo(i+7, s[1]-20);
            x.lineTo(i+14, s[1]);
            x.closePath();
            x.fill();
        }
        x.shadowBlur = 0;
    }

    // Gambar cincin dengan efek glow
    for(const r of rings){
        if(!r[2]){
            x.shadowColor = "#e4c534";
            x.shadowBlur = 15;
            x.strokeStyle = "#e4c534";
            x.lineWidth = 5;
            x.beginPath();
            x.arc(r[0], r[1], 11, 0, Math.PI*2);
            x.stroke();
            
            x.shadowBlur = 0;
            x.strokeStyle = "#ffd700";
            x.lineWidth = 2;
            x.beginPath();
            x.arc(r[0], r[1], 7, 0, Math.PI*2);
            x.stroke();
        }
    }
    x.shadowBlur = 0;

    // Gambar finish
    x.fillStyle = "#ddd";
    x.fillRect(770, 310, 5, 130);
    x.fillStyle = "#cc3333";
    x.fillRect(775, 310, 25, 20);
    x.fillStyle = "#ff4444";
    x.fillRect(778, 313, 19, 14);
    x.fillStyle = "#fff";
    x.font = "bold 12px monospace";
    x.fillText("GOAL", 778, 325);

    // Gambar ball
    x.save();
    x.translate(ball.x, ball.y);
    
    // Shadow ball
    x.shadowColor = "rgba(0,0,0,0.25)";
    x.shadowBlur = 6;
    x.shadowOffsetY = 2;
    
    // Bola utama dengan efek 3D
    let ballGrad = x.createRadialGradient(-5, -5, 2, 0, 0, ball.r);
    ballGrad.addColorStop(0, '#ff6b6b');
    ballGrad.addColorStop(0.5, '#e03030');
    ballGrad.addColorStop(1, '#8b1010');
    x.fillStyle = ballGrad;
    x.beginPath();
    x.arc(0, 0, ball.r, 0, Math.PI*2);
    x.fill();
    
    // Highlight
    x.shadowBlur = 0;
    x.fillStyle = "rgba(255,255,255,0.3)";
    x.beginPath();
    x.arc(-4, -5, 5, 0, Math.PI*2);
    x.fill();
    x.fillStyle = "rgba(255,255,255,0.12)";
    x.beginPath();
    x.arc(-6, -7, 3, 0, Math.PI*2);
    x.fill();
    
    x.restore();

    // HUD
    x.shadowBlur = 0;
    x.fillStyle = "rgba(30,40,30,0.85)";
    x.beginPath();
    x.roundRect(12, 12, 200, 46, 8);
    x.fill();
    
    x.fillStyle = "#fff";
    x.font = "bold 20px monospace";
    x.fillText("RINGS " + score + "/" + rings.length, 25, 42);
    
    // Progress bar
    x.fillStyle = "rgba(0,0,0,0.5)";
    x.fillRect(225, 22, 350, 26);
    x.fillStyle = "rgba(255,255,255,0.15)";
    x.fillRect(227, 24, 346, 22);
    
    let progress = (score / rings.length) * 340;
    if(progress > 0) {
        let gradBar = x.createLinearGradient(227, 0, 227 + progress, 0);
        gradBar.addColorStop(0, '#ffd700');
        gradBar.addColorStop(1, '#ff8c00');
        x.fillStyle = gradBar;
        x.fillRect(227, 24, progress, 22);
    }
    
    x.fillStyle = "#fff";
    x.font = "11px monospace";
    x.fillText("PROGRESS", 375, 40);

    // Informasi kontrol
    x.fillStyle = "rgba(30,40,30,0.85)";
    x.beginPath();
    x.roundRect(590, 12, 200, 46, 8);
    x.fill();
    x.fillStyle = "#aaa";
    x.font = "12px monospace";
    x.fillText("← → ↑ untuk bergerak", 603, 34);
    x.fillText("R untuk restart", 625, 50);

    if(won){
        x.fillStyle = "rgba(0,0,0,0.75)";
        x.beginPath();
        x.roundRect(190, 140, 420, 200, 20);
        x.fill();
        
        let pulse = Math.sin(frameCount * 0.05) * 0.08 + 1;
        x.save();
        x.translate(400, 220);
        x.scale(pulse, pulse);
        
        x.fillStyle = "#ffd700";
        x.font = "bold 36px monospace";
        x.textAlign = "center";
        x.fillText("★ LEVEL COMPLETE!", 0, 0);
        x.restore();
        
        x.fillStyle = "#fff";
        x.font = "18px monospace";
        x.textAlign = "center";
        x.fillText("Tekan R untuk main lagi", 400, 278);
    }

    // roundRect polyfill
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        this.moveTo(x + r, y);
        this.lineTo(x + w - r, y);
        this.quadraticCurveTo(x + w, y, x + w, y + r);
        this.lineTo(x + w, y + h - r);
        this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        this.lineTo(x + r, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - r);
        this.lineTo(x, y + r);
        this.quadraticCurveTo(x, y, x + r, y);
        return this;
    };
}

function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
</script></body></html>
