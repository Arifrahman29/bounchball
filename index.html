<title>Super Mario Bros - Classic Edition</title>

*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Courier New',monospace;overflow:hidden}
#wrap{position:relative;width:min(1000px,100vw);padding:10px}
#gameContainer{background:#000;border-radius:16px;padding:8px;box-shadow:0 0 80px rgba(0,150,255,0.2), inset 0 0 40px rgba(0,0,0,0.5)}

#controls kbd{background:#1a1a3a;color:#4fc3f7;padding:6px 14px;border-radius:6px;font-size:13px;border:2px solid #3a3a5a;font-weight:bold;min-width:40px;text-align:center}
#controls span{color:#666;font-size:13px;margin:0 4px}
#status{color:#4fc3f7;font-size:14px;font-weight:bold;display:flex;gap:20px;align-items:center}
#status .label{color:#888;font-weight:normal}
#status .value{color:#ffd700}
#hint{color:#555;font-size:11px;text-align:center;margin-top:6px}
</style>
</head>

function rectCollide(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;

// ---------- Helper: bikin segmen tanah dengan jurang ----------
function groundWithGaps(totalWidth, gaps, type='ground') {
    const segs = [];
    let cursor = 0;
    const sorted = [...gaps].sort((a,b)=>a[0]-b[0]);
    for (const [gs, ge] of sorted) {
        if (gs > cursor) segs.push({x:cursor, y:GROUND_Y, w:gs-cursor, h:60, type});
        cursor = ge;
    }
    if (cursor < totalWidth) segs.push({x:cursor, y:GROUND_Y, w:totalWidth-cursor, h:60, type});
    return segs;
}

function staircase(startX, steps, dir, groundType, stepW=32) {
    const out = [];
    for (let i = 0; i < steps; i++) {
        const h = dir === 1 ? (i+1)*stepW : (steps-i)*stepW;
        out.push({x: startX + i*stepW, y: GROUND_Y - h, w: stepW, h: h, type: 'stair_'+groundType});
    }
    return out;
}

const STAGES = [stage11, stage12, stage13, stage21, stage22, stage31];

// ============================================================
//  GAME STATE
// ============================================================
let currentStageIndex = 0;
let player = {};
let enemies = [];
let coins = [];
let platforms = [];
let items = []; // jamur power-up yang sedang aktif
let flag = {};
let camera = {x: 0};
let gameOver = false;
let winScreen = false;
let frameCount = 0;
let deathTimer = 0;
let stageTransition = 0;
let particles = [];
let hills = [], bushes = [];

const SMALL_H = 32, BIG_H = 48, PLAYER_W = 26;

function buildScenery(levelWidth) {
    hills = []; bushes = [];
    const n = Math.ceil(levelWidth / 380) + 2;
    for (let i = 0; i < n; i++) hills.push({x: i * 380 + 60, r: 70 + (i % 2) * 25});
    const m = Math.ceil(levelWidth / 220) + 2;
    for (let i = 0; i < m; i++) bushes.push({x: i * 220 + 40, scale: 0.8 + (i % 3) * 0.3});
}

function loadStage(index) {
    const stage = STAGES[index];
    platforms = stage.platforms.map(p => ({...p, used: false, bump: 0}));
    enemies = stage.enemies.map(e => ({
        ...e, alive: true, squish: 0,
        vx: (Math.random() > 0.5 ? 1 : -1) * (0.7 + Math.random() * 0.5),
        vy: 0, onGround: false, walkPhase: Math.random()*10
    }));
    coins = stage.coins.map(c => ({...c, collected: false}));
    items = [];
    flag = {...stage.flag};
    buildScenery(stage.levelWidth);

    const keepSize = player.size || 'small';
    player = {
        x: 40, y: GROUND_Y - (keepSize==='big'?BIG_H:SMALL_H), w: PLAYER_W,
        h: keepSize==='big'?BIG_H:SMALL_H, size: keepSize,
        vx: 0, vy: 0, onGround: false,
        facing: 1, walkPhase: 0, legLift:0, invincible: 0, dead: false,
        flagSliding: false, walkingToCastle: false, coyote: 0, jumpBuffer: 0,
        growAnim: 0, skid: false,
        score: player.score || 0, coins: player.coins || 0, lives: player.lives || 3
    };

    camera.x = 0;
    gameOver = false; winScreen = false; deathTimer = 0; stageTransition = 0;
    particles = [];
    document.getElementById('stageDisplay').textContent = stage.name;
    updateUI();
}

function resetGame() {
    currentStageIndex = 0;
    player = {lives: 3, coins: 0, score: 0, size:'small'};
    loadStage(currentStageIndex);
}

function updateUI() {
    document.getElementById('livesDisplay').textContent = player.lives || 0;
    document.getElementById('coinDisplay').textContent = player.coins || 0;
    document.getElementById('scoreDisplay').textContent = player.score || 0;
    document.getElementById('powerDisplay').textContent = player.size === 'big' ? '⭐ Super Mario' : '';
}

function addParticles(x, y, color, count = 8) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 3;
        particles.push({
            x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 1,
            life: 30 + Math.random() * 20, maxLife: 50, size: 3 + Math.random() * 4, color
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function updateCamera() {
    const stage = STAGES[currentStageIndex];
    const maxCam = Math.max(0, stage.levelWidth - W);
    let targetCam = player.x - 400;
    if (targetCam < 0) targetCam = 0;
    if (targetCam > maxCam) targetCam = maxCam;
    camera.x += (targetCam - camera.x) * 0.14;
}

function growPlayer() {
    if (player.size === 'big') { player.score += 200; updateUI(); return; }
    const oldH = player.h;
    player.size = 'big';
    player.h = BIG_H;
    player.y -= (BIG_H - oldH);
    player.growAnim = 20;
    player.invincible = 40;
    player.score += 1000;
    updateUI();
    addParticles(player.x + player.w/2, player.y + player.h/2, '#ffe680', 16);
}

function shrinkPlayer() {
    const oldH = player.h;
    player.size = 'small';
    player.h = SMALL_H;
    player.y += (oldH - SMALL_H);
    player.invincible = 90;
    updateUI();
}

// ============================================================
//  UPDATE
// ============================================================
function update() {
    frameCount++;
    if (gameOver) { if (keys['r']) resetGame(); return; }

    if (winScreen) {
        stageTransition++;
        if (stageTransition > 90) {
            currentStageIndex++;
            if (currentStageIndex >= STAGES.length) {
                player.score += 10000; updateUI();
                setTimeout(() => resetGame(), 3000);
                return;
            }
            loadStage(currentStageIndex);
        }
        return;
    }

    if (player.dead) {
        deathTimer++;
        if (deathTimer > 60) {
            if (player.lives > 0) { player.lives--; player.size='small'; updateUI(); loadStage(currentStageIndex); }
            else gameOver = true;
        }
        return;
    }

    if (player.flagSliding) {
        player.y += 3.4;
        player.x = flag.x - player.w / 2;
        const bottom = GROUND_Y - player.h;
        if (player.y >= bottom) {
            player.y = bottom; player.flagSliding = false;
            player.walkingToCastle = true; player.walkTimer = 40;
        }
        updateParticles();
        return;
    }

    if (player.walkingToCastle) {
        player.walkTimer--; player.x += 2.2;
        player.walkPhase += 0.35;
        updateCamera(); updateParticles();
        if (player.walkTimer <= 0) {
            player.walkingToCastle = false; winScreen = true;
            player.score += 2000; updateUI();
        }
        return;
    }

    const running = keys['shift'];
    let moveX = 0;
    if (keys['arrowleft']) moveX = -1;
    if (keys['arrowright']) moveX = 1;

    const accel = running ? RUN_ACCEL : ACCEL;
    const maxSpeed = running ? MAX_RUN_SPEED : MAX_WALK_SPEED;

    // deteksi skid: berbalik arah cepat saat di darat
    player.skid = player.onGround && moveX !== 0 && player.vx !== 0 &&
                  Math.sign(moveX) !== Math.sign(player.vx) && Math.abs(player.vx) > 1.5;

    if (moveX !== 0) {
        player.vx += moveX * accel;
        if (Math.abs(player.vx) > maxSpeed) player.vx = moveX * maxSpeed;
        player.facing = moveX;
    } else {
        player.vx *= player.onGround ? FRICTION_GROUND : FRICTION_AIR;
        if (Math.abs(player.vx) < 0.08) player.vx = 0;
    }

    // gerak kaki halus & terus menerus (bukan loncat 2 frame)
    if (player.onGround && Math.abs(player.vx) > 0.2) {
        player.walkPhase += Math.min(Math.abs(player.vx) * 0.11 + 0.08, 0.9);
    }

    // coyote time + jump buffer -> lompatan terasa lebih responsif & tidak kaku
    if (player.onGround) player.coyote = COYOTE_FRAMES; else if (player.coyote > 0) player.coyote--;
    if (keys['z'] || keys['arrowup']) player.jumpBuffer = JUMP_BUFFER_FRAMES; else if (player.jumpBuffer > 0) player.jumpBuffer--;

    if (player.jumpBuffer > 0 && player.coyote > 0) {
        let jf = JUMP_FORCE;
        if (Math.abs(player.vx) > MAX_WALK_SPEED * 0.9) jf += RUN_JUMP_BONUS;
        player.vy = jf; player.onGround = false; player.coyote = 0; player.jumpBuffer = 0;
        addParticles(player.x + player.w/2, player.y + player.h, '#ffffff', 4);
    }
    if (!keys['z'] && !keys['arrowup'] && player.vy < -2) player.vy *= 0.86;

    player.vy += GRAVITY;
    if (player.vy > MAX_FALL_SPEED) player.vy = MAX_FALL_SPEED;

    player.x += player.vx;
    for (const p of platforms) {
        if (rectCollide(player, p)) {
            if (player.vx > 0) player.x = p.x - player.w;
            else if (player.vx < 0) player.x = p.x + p.w;
            player.vx = 0;
        }
    }

    player.y += player.vy;
    const wasOnGround = player.onGround;
    player.onGround = false;

    for (const p of platforms) {
        if (rectCollide(player, p)) {
            if (player.vy > 0) {
                player.y = p.y - player.h; player.vy = 0; player.onGround = true;
                if (!wasOnGround) addParticles(player.x+player.w/2, player.y+player.h, 'rgba(255,255,255,0.5)', 3);
            } else if (player.vy < 0) {
                player.y = p.y + p.h; player.vy = 0;
                hitBlockFromBelow(p);
            }
        }
    }

    for (const c of coins) {
        if (!c.collected) {
            const dx = player.x + player.w/2 - c.x;
            const dy = player.y + player.h/2 - c.y;
            if (Math.hypot(dx, dy) < 22) {
                c.collected = true; player.coins++; player.score += 100; updateUI();
                addParticles(c.x, c.y, '#ffd700', 10);
            }
        }
    }

    for (const p of platforms) {
        if (p.bump) { p.bump *= 0.7; if (Math.abs(p.bump) < 0.3) p.bump = 0; }
    }

    updateItems();
    updateEnemies();

    if (!player.dead && !player.flagSliding) {
        const dx = player.x + player.w/2 - flag.x;
        const dy = player.y + player.h - flag.y;
        if (Math.abs(dx) < 24 && dy > -10 && dy < flag.height + 20) {
            player.flagSliding = true; player.vx = 0; player.vy = 0;
            addParticles(flag.x, flag.y, '#ffd700', 16);
        }
    }

    if (player.y > H + 80) { player.dead = true; player.lives--; updateUI(); deathTimer = 0; }

    updateCamera();
    if (player.invincible > 0) player.invincible--;
    if (player.growAnim > 0) player.growAnim--;
    updateParticles();
}

function hitBlockFromBelow(p) {
    if (p.type === 'question' && p.item && !p.used) {
        p.used = true; p.bump = 8;
        if (p.item === 'coin') {
            player.coins++; player.score += 200; updateUI();
            addParticles(p.x + p.w/2, p.y, '#f0c040', 12);
        } else if (p.item === 'mushroom') {
            spawnMushroom(p);
            addParticles(p.x + p.w/2, p.y, '#f0c040', 8);
        }
    } else if (p.type.startsWith('brick')) {
        p.bump = 6;
        addParticles(p.x + p.w/2, p.y + p.h/2, PAL.brick, 6);
    }
}

function spawnMushroom(block) {
    items.push({
        type: 'mushroom', x: block.x + block.w/2 - 12, y: block.y - 4,
        targetY: block.y - 34, w: 24, h: 24, vx: 0, vy: 0,
        state: 'rising'
    });
}

function updateItems() {
    for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        if (it.state === 'rising') {
            it.y -= 1.1;
            if (it.y <= it.targetY) { it.y = it.targetY; it.state = 'active'; it.vx = 1.6; }
        } else {
            it.vy += GRAVITY * 0.7;
            it.x += it.vx;
            for (const p of platforms) {
                if (rectCollide(it, p)) {
                    if (it.vx > 0) { it.x = p.x - it.w; it.vx *= -1; }
                    else if (it.vx < 0) { it.x = p.x + p.w; it.vx *= -1; }
                }
            }
            it.y += it.vy;
            for (const p of platforms) {
                if (rectCollide(it, p)) {
                    if (it.vy > 0) { it.y = p.y - it.h; it.vy = 0; }
                    else if (it.vy < 0) { it.y = p.y + p.h; it.vy = 0; }
                }
            }
            if (it.y > H + 80) { items.splice(i,1); continue; }
            if (!player.dead && rectCollide(player, it)) {
                growPlayer();
                items.splice(i,1);
            }
        }
    }
}

function updateEnemies() {
    for (const e of enemies) {
        if (!e.alive) continue;
        if (e.squish > 0) { e.squish--; if (e.squish <= 0) e.alive = false; continue; }

        e.walkPhase += 0.14;
        e.x += e.vx;
        e.vy += GRAVITY;
        e.y += e.vy;
        e.onGround = false;

        for (const p of platforms) {
            if (rectCollide(e, p)) {
                if (e.vy > 0) { e.y = p.y - e.h; e.vy = 0; e.onGround = true; }
                else if (e.vy < 0) { e.y = p.y + p.h; e.vy = 0; }
                if (e.vx > 0 && e.x + e.w > p.x && e.x < p.x) { e.x = p.x - e.w; e.vx *= -1; }
                else if (e.vx < 0 && e.x < p.x + p.w && e.x + e.w > p.x + p.w) { e.x = p.x + p.w; e.vx *= -1; }
            }
        }

        if (e.y > H + 80) { e.alive = false; continue; }

        if (!player.invincible && !player.dead && rectCollide(player, e)) {
            if (player.vy > 0 && player.y + player.h - e.y < 30) {
                e.squish = 14; e.vx = 0;
                player.vy = -8; player.score += 500; updateUI();
                addParticles(e.x + e.w/2, e.y + e.h/2, PAL.goombaDark, 12);
            } else if (player.size === 'big') {
                shrinkPlayer();
                addParticles(player.x + player.w/2, player.y + player.h/2, '#ff5050', 10);
            } else {
                player.dead = true; player.vy = -8; deathTimer = 0;
                player.lives--; updateUI();
            }
        }
    }
}

// ============================================================
//  DRAW HELPERS - SPRITES (kurva halus, shading berlapis)
// ============================================================
function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
}

function drawMario(dx, dy, w, h, facing, legPhase, onGround, jumping, skid, big, growAnim) {
    ctx.save();
    const scaleBoost = growAnim ? 1 + Math.sin(growAnim*0.9)*0.06 : 1;
    ctx.translate(dx + w/2, dy + h/2);
    ctx.scale((facing < 0 ? -1 : 1) * (w/26) * scaleBoost, (h/32) * scaleBoost);

    const legSwing = jumping ? 0 : (onGround ? Math.sin(legPhase) * 5 : 0);
    const armUp = jumping;
    const bodyH = big ? 15 + 12 : 15; // sedikit lebih panjang saat besar (skala sudah menangani sisanya)

    // sepatu
    ctx.fillStyle = PAL.hairDark;
    if (jumping) { roundRect(-9.5,11,9,7,2); ctx.fill(); roundRect(1.5,11,9,7,2); ctx.fill(); }
    else if (skid) { roundRect(-11,11,20,7,2); ctx.fill(); }
    else {
        roundRect(-10+legSwing*0.6, 11, 9, 7, 2); ctx.fill();
        roundRect(1-legSwing*0.6, 11, 9, 7, 2); ctx.fill();
    }

    // celana overall (kaki + badan)
    ctx.fillStyle = PAL.marioBlue;
    if (jumping) { roundRect(-8,-2,7,14,2); ctx.fill(); roundRect(1,-2,7,14,2); ctx.fill(); }
    else if (skid) { roundRect(-9,-2,18,14,2); ctx.fill(); }
    else {
        roundRect(-9+legSwing*0.5, -2, 7, 14, 2); ctx.fill();
        roundRect(2-legSwing*0.5, -2, 7, 14, 2); ctx.fill();
    }
    roundRect(-9, -5, 18, 10, 3); ctx.fill();

    // bayangan sisi badan
    ctx.fillStyle = PAL.marioBlueDark;
    roundRect(-9,-5,4,10,2); ctx.fill();

    // kancing kuning
    ctx.fillStyle = PAL.buttonYellow;
    ctx.beginPath(); ctx.arc(-5,-4,1.7,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(4,-4,1.7,0,7); ctx.fill();

    // lengan baju (mengayun berlawanan arah kaki)
    const armSwing = jumping ? 0 : Math.sin(legPhase + Math.PI) * 3;
    ctx.fillStyle = PAL.marioRed;
    if (armUp) { roundRect(-14,-15,6,11,2); ctx.fill(); roundRect(8,-4,6,9,2); ctx.fill(); }
    else { roundRect(-13, -4+armSwing*0.4, 6, 9, 2); ctx.fill(); roundRect(7, -4-armSwing*0.4, 6, 9, 2); ctx.fill(); }

    // sarung tangan putih
    ctx.fillStyle = PAL.white;
    if (armUp) { ctx.beginPath(); ctx.arc(-11,-18,3.4,0,7); ctx.fill(); }
    else {
        ctx.beginPath(); ctx.arc(-11, 4+armSwing*0.4, 3.2, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.arc(11, 4-armSwing*0.4, 3.2, 0, 7); ctx.fill();
    }

    // dada kemeja merah
    ctx.fillStyle = PAL.marioRed;
    roundRect(-9, -9, 18, 5, 2); ctx.fill();

    // wajah
    ctx.fillStyle = PAL.skin;
    roundRect(-8, -21, 17, 13, 4); ctx.fill();
    ctx.fillStyle = PAL.skinShade;
    roundRect(-8, -12, 17, 3, 2); ctx.fill();

    // rambut samping / cambang
    ctx.fillStyle = PAL.hair;
    roundRect(-9, -17, 4, 8, 2); ctx.fill();
    // kumis
    ctx.fillStyle = PAL.hairDark;
    roundRect(-3, -12, 12, 3, 1); ctx.fill();
    roundRect(-4, -14, 5, 3, 1); ctx.fill();
    // hidung
    ctx.fillStyle = PAL.skin;
    ctx.beginPath(); ctx.ellipse(9,-13,4,3.4,0,0,7); ctx.fill();
    // mata
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.arc(2,-17,1.8,0,7); ctx.fill();

    // topi
    ctx.fillStyle = PAL.marioRed;
    roundRect(-9, -25, 18, 5, 2); ctx.fill();
    roundRect(-9, -21, 23, 4, 3); ctx.fill();
    ctx.fillStyle = PAL.marioRedDark;
    ctx.beginPath(); ctx.arc(2,-21,4.2,0,7); ctx.fill();
    ctx.fillStyle = PAL.white;
    ctx.font = 'bold 6px monospace'; ctx.textAlign='center';
    ctx.fillText('M', 1, -19);

    ctx.restore();
}

function drawGoomba(dx, dy, w, h, phase, squish) {
    ctx.save();
    ctx.translate(dx + w/2, dy + h/2);
    const sq = squish > 0 ? squish / 14 : 0;
    ctx.scale(1 + sq * 0.5, 1 - sq * 0.7);
    ctx.translate(0, h/2 * sq * 0.6);

    // badan bulat dengan bayangan bawah untuk kesan 3D
    ctx.fillStyle = PAL.goombaDark;
    ctx.beginPath(); ctx.ellipse(0, h*0.12, w/2, h/2 * 0.62, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = PAL.goomba;
    ctx.beginPath();
    ctx.moveTo(-w/2, 0);
    ctx.quadraticCurveTo(-w/2, -h/2, 0, -h/2);
    ctx.quadraticCurveTo(w/2, -h/2, w/2, 0);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = PAL.goombaBelly;
    ctx.beginPath(); ctx.ellipse(0, -h*0.05, w/2-4, h/2-8, 0, 0, Math.PI*2); ctx.fill();

    if (squish <= 0) {
        const footShift = Math.sin(phase) * 2.5;
        ctx.fillStyle = PAL.goombaFoot;
        roundRect(-w/2 + 1 + footShift, h/2 - 6, w/2 - 3, 6, 2); ctx.fill();
        roundRect(1 - footShift, h/2 - 6, w/2 - 3, 6, 2); ctx.fill();

        // alis marah khas goomba
        ctx.strokeStyle = '#2a1608'; ctx.lineWidth = 2.2; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(-w/2+3,-h/2+9); ctx.lineTo(-1,-h/2+13); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(w/2-3,-h/2+9); ctx.lineTo(1,-h/2+13); ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.ellipse(-w/2+8,-h/2+16,4,4.4,0,0,7); ctx.fill();
        ctx.beginPath(); ctx.ellipse(w/2-8,-h/2+16,4,4.4,0,0,7); ctx.fill();
        ctx.fillStyle = '#1a1a1a';
        ctx.beginPath(); ctx.arc(-w/2+9,-h/2+17,2,0,7); ctx.fill();
        ctx.beginPath(); ctx.arc(w/2-9,-h/2+17,2,0,7); ctx.fill();
    } else {
        ctx.strokeStyle = '#2a1608'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(-w/2+5,-2); ctx.lineTo(-w/2+11,4); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-w/2+11,-2); ctx.lineTo(-w/2+5,4); ctx.stroke();
    }
    ctx.restore();
}

function drawMushroom(dx, dy, w, h) {
    ctx.save();
    ctx.translate(dx + w/2, dy + h/2);
    ctx.fillStyle = PAL.mushStemShade;
    roundRect(-w/2+4, h/2-10, w-8, 10, 3); ctx.fill();
    ctx.fillStyle = PAL.mushStem;
    roundRect(-w/2+5, h/2-10, w-10, 8, 3); ctx.fill();
    ctx.fillStyle = PAL.mushCapDark;
    ctx.beginPath(); ctx.arc(0, -h*0.05, w/2, Math.PI, 0); ctx.fill();
    ctx.fillStyle = PAL.mushCap;
    ctx.beginPath(); ctx.ellipse(0, -h*0.08, w/2-2, h/2-3, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = PAL.mushSpot;
    ctx.beginPath(); ctx.ellipse(-w*0.22,-h*0.28,3.4,3,0,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(w*0.22,-h*0.28,3.4,3,0,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0,-h*0.42,3,2.6,0,0,7); ctx.fill();
    ctx.restore();
}

function drawCastle(dx) {
    ctx.fillStyle = PAL.castleGray;
    ctx.fillRect(dx, GROUND_Y - 100, 130, 100);
    ctx.fillStyle = PAL.castleDark;
    for (let i=0;i<5;i++) ctx.fillRect(dx + i*28 - 4, GROUND_Y - 112, 14, 14);
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(dx + 50, GROUND_Y - 46, 24, 46);
    ctx.fillStyle = '#3a2a1a';
    ctx.beginPath(); ctx.arc(dx + 62, GROUND_Y - 46, 12, Math.PI, 0); ctx.fill();
    ctx.fillStyle = PAL.castleDark;
    ctx.fillRect(dx+20, GROUND_Y-70, 10, 10);
    ctx.fillRect(dx+96, GROUND_Y-70, 10, 10);
}

// ============================================================
//  DRAW
// ============================================================
function draw() {
    ctx.clearRect(0, 0, W, H);
    const stage = STAGES[currentStageIndex];

    let grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, stage.bgColor1); grad.addColorStop(1, stage.bgColor2);
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);

    const underground = stage.theme === 'underground';
    const castle = stage.theme === 'castle';

    if (!underground && !castle) {
        const cloudPositions = [
            {x:100, y:50, s:1.5}, {x:350, y:30, s:1.0}, {x:600, y:60, s:1.8},
            {x:850, y:40, s:1.2}, {x:1100, y:55, s:1.4}, {x:1350, y:35, s:1.1},
            {x:1650, y:45, s:1.3}, {x:1950, y:35, s:1.0}, {x:2250, y:55, s:1.5},
        ];
        for (const c of cloudPositions) {
            const cx = c.x - camera.x * 0.4;
            if (cx < -150 || cx > W + 150) continue;
            ctx.fillStyle = '#FCFCFC';
            ctx.beginPath();
            ctx.arc(cx - 30*c.s, c.y, 25*c.s, 0, Math.PI*2);
            ctx.arc(cx, c.y - 15*c.s, 30*c.s, 0, Math.PI*2);
            ctx.arc(cx + 30*c.s, c.y, 25*c.s, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.fillStyle = 'rgba(0,168,0,0.35)';
        for (const hl of hills) {
            const hx = hl.x - camera.x * 0.6;
            if (hx < -120 || hx > W + 120) continue;
            ctx.beginPath(); ctx.arc(hx, GROUND_Y + 10, hl.r, Math.PI, 0); ctx.fill();
        }
        ctx.fillStyle = '#00A800';
        for (const b of bushes) {
            const bx = b.x - camera.x * 0.85;
            if (bx < -60 || bx > W + 60) continue;
            const s = b.scale;
            ctx.beginPath();
            ctx.arc(bx, GROUND_Y - 6, 14*s, 0, Math.PI*2);
            ctx.arc(bx + 16*s, GROUND_Y - 10, 16*s, 0, Math.PI*2);
            ctx.arc(bx + 32*s, GROUND_Y - 6, 14*s, 0, Math.PI*2);
            ctx.fill();
        }
    } else {
        ctx.fillStyle = underground ? 'rgba(0,0,0,0.2)' : 'rgba(0,0,0,0.25)';
        const off = camera.x % 40;
        for (let x = -off; x < W; x += 40) {
            for (let y = 0; y < H; y += 40) {
                ctx.strokeStyle = 'rgba(255,255,255,0.06)';
                ctx.strokeRect(x, y, 40, 40);
            }
        }
    }

    const drawX = (x) => x - camera.x;

    for (const p of platforms) {
        const dx = drawX(p.x);
        if (dx < -140 || dx > W + 20) continue;
        const by = p.y - (p.bump || 0);

        if (p.type.startsWith('ground') || p.type.startsWith('stair')) {
            const uType = p.type.includes('_u') ? 'u' : (p.type.includes('castle') ? 'c' : (p.type.includes('_c') ? 'c' : 'g'));
            const top = uType==='u' ? '#3a3a6a' : (uType==='c' ? '#6a4a4a' : PAL.groundTop);
            const body = uType==='u' ? '#26264a' : (uType==='c' ? '#4a2a2a' : PAL.groundBody);
            ctx.fillStyle = top; ctx.fillRect(dx, p.y, p.w, Math.min(8,p.h));
            ctx.fillStyle = body; ctx.fillRect(dx, p.y+8, p.w, Math.max(0,p.h-8));
            ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 1;
            for (let i=0; i<p.w; i+=24) { ctx.strokeRect(dx+i, p.y+8, 24, 16); ctx.strokeRect(dx+i-12, p.y+24, 24, 16); }
            if (uType==='g') {
                ctx.fillStyle = '#4ec22e';
                for (let i=0; i<p.w; i+=6) ctx.fillRect(dx+i, p.y-2, 2, 4);
            } else if (uType==='c') {
                ctx.fillStyle = '#a86a4a';
                for (let i=0; i<p.w; i+=6) ctx.fillRect(dx+i, p.y-2, 2, 4);
            }
        } else if (p.type === 'brick' || p.type === 'brick_u' || p.type === 'brick_c') {
            const c1 = p.type === 'brick' ? PAL.brick : (p.type === 'brick_u' ? '#4a4a8a' : '#8a4a3a');
            const c2 = p.type === 'brick' ? PAL.brickDark : (p.type === 'brick_u' ? '#2a2a5a' : '#5a2a1a');
            ctx.fillStyle = c1; ctx.fillRect(dx, by, p.w, p.h);
            ctx.fillStyle = PAL.brickLight; ctx.fillRect(dx+2, by+2, p.w-4, 3);
            ctx.strokeStyle = c2; ctx.lineWidth = 2; ctx.strokeRect(dx+1, by+1, p.w-2, p.h-2);
            ctx.strokeStyle = c2; ctx.beginPath();
            ctx.moveTo(dx+p.w/2, by); ctx.lineTo(dx+p.w/2, by+p.h/2);
            ctx.moveTo(dx, by+p.h/2); ctx.lineTo(dx+p.w, by+p.h/2);
            ctx.moveTo(dx+p.w/4, by+p.h/2); ctx.lineTo(dx+p.w/4, by+p.h);
            ctx.moveTo(dx+3*p.w/4, by+p.h/2); ctx.lineTo(dx+3*p.w/4, by+p.h);
            ctx.stroke();
        } else if (p.type === 'question') {
            const isActive = p.item && !p.used;
            ctx.fillStyle = isActive ? PAL.block : '#8a8a8a';
            ctx.fillRect(dx, by, p.w, p.h);
            ctx.fillStyle = isActive ? PAL.blockLight : '#a8a8a8';
            ctx.fillRect(dx+2, by+2, p.w-4, 3);
            ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 2;
            ctx.strokeRect(dx+1, by+1, p.w-2, p.h-2);
            ctx.fillStyle = isActive ? PAL.blockDark : '#5a5a5a';
            ctx.fillRect(dx+3, by+3, 3, 3); ctx.fillRect(dx+p.w-6, by+3, 3, 3);
            ctx.fillRect(dx+3, by+p.h-6, 3, 3); ctx.fillRect(dx+p.w-6, by+p.h-6, 3, 3);
            if (isActive) {
                const pulse = Math.sin(frameCount * 0.08) * 2;
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 20px monospace'; ctx.textAlign = 'center';
                ctx.fillText('?', dx+p.w/2, by+p.h/2+7+pulse/2);
            }
        } else if (p.type === 'platform' || p.type === 'platform_u' || p.type === 'platform_c') {
            const c1 = p.type === 'platform' ? PAL.groundBody : (p.type === 'platform_u' ? '#4a4a7a' : '#7a4a4a');
            ctx.fillStyle = c1; ctx.fillRect(dx, p.y, p.w, p.h);
            ctx.fillStyle = 'rgba(0,0,0,0.25)';
            ctx.fillRect(dx, p.y, p.w, 2); ctx.fillRect(dx, p.y+p.h-2, p.w, 2);
        } else if (p.type === 'pipe') {
            ctx.fillStyle = PAL.pipeDark;
            ctx.fillRect(dx-3, p.y-10, p.w+6, 10);
            ctx.fillRect(dx, p.y, p.w, p.h);
            ctx.fillStyle = PAL.pipeBody;
            ctx.fillRect(dx+2, p.y-8, p.w-6, 6);
            ctx.fillRect(dx+3, p.y+3, p.w-16, p.h-6);
            ctx.fillStyle = PAL.pipeLight;
            ctx.fillRect(dx+4, p.y-7, 6, 4);
            ctx.fillRect(dx+5, p.y+5, 4, p.h-10);
        }
    }

    for (const c of coins) {
        if (c.collected) continue;
        const dx = drawX(c.x);
        if (dx < -30 || dx > W+30) continue;
        const scale = Math.abs(Math.sin(frameCount * 0.06 + c.x));
        ctx.fillStyle = PAL.block;
        ctx.beginPath(); ctx.ellipse(dx, c.y, 8*scale+2, 8, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#ffe680';
        ctx.beginPath(); ctx.ellipse(dx, c.y, 4*scale+1, 4, 0, 0, Math.PI*2); ctx.fill();
    }

    for (const it of items) {
        const dx = drawX(it.x);
        if (dx < -40 || dx > W+40) continue;
        if (it.type === 'mushroom') drawMushroom(dx, it.y, it.w, it.h);
    }

    for (const e of enemies) {
        if (!e.alive) continue;
        const dx = drawX(e.x);
        if (dx < -60 || dx > W+40) continue;
        drawGoomba(dx, e.y, 28, 26, e.walkPhase, e.squish);
    }

    drawCastle(drawX(flag.x + 90));

    const fdx = drawX(flag.x);
    if (fdx > -40 && fdx < W+40) {
        const poleTop = flag.y - 10;
        ctx.fillStyle = '#9aa0a8';
        ctx.fillRect(fdx, poleTop, 4, flag.height + 10);
        ctx.fillStyle = '#ffd700';
        ctx.beginPath(); ctx.arc(fdx+2, poleTop, 6, 0, Math.PI*2); ctx.fill();
        let flagY = (winScreen || player.flagSliding || player.walkingToCastle) ? poleTop + 4 : flag.y;
        const wave = Math.sin(frameCount*0.1)*3;
        ctx.fillStyle = '#3fbf3f';
        ctx.beginPath();
        ctx.moveTo(fdx+4, flagY-8);
        ctx.quadraticCurveTo(fdx+24+wave, flagY+4, fdx+4, flagY+18);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px monospace'; ctx.textAlign = 'center';
        ctx.fillText('M', fdx+13+wave/2, flagY+6);
        ctx.fillStyle = '#6a6a6a';
        ctx.fillRect(fdx-5, flag.y+flag.height-4, 14, 8);
    }

    if (!player.dead && player.invincible % 4 < 2) {
        const dx = drawX(player.x);
        const jumping = !player.onGround && !player.flagSliding && !player.walkingToCastle;
        let facing = player.facing;
        if (player.flagSliding) facing = -1;
        drawMario(dx, player.y, player.w, player.h, facing, player.walkPhase, player.onGround || player.walkingToCastle, jumping, player.skid, player.size==='big', player.growAnim);
    }

    for (const p of particles) {
        const alpha = p.life / p.maxLife;
        ctx.globalAlpha = alpha; ctx.fillStyle = p.color;
        ctx.fillRect(p.x - camera.x, p.y, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    // HUD
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(10, 10, 160, 30); ctx.fillRect(180, 10, 120, 30);
    ctx.fillRect(310, 10, 200, 30); ctx.fillRect(W-100, 10, 90, 30);
    ctx.fillStyle = '#ff6b6b'; ctx.font = '20px monospace'; ctx.textAlign = 'left';
    ctx.fillText(`❤️ x${player.lives}`, 18, 33);
    ctx.fillStyle = '#ffd700'; ctx.fillText(`🪙 ${player.coins}`, 188, 33);
    ctx.fillStyle = '#fff'; ctx.fillText(`🏆 ${player.score}`, 318, 33);
    ctx.fillStyle = '#4fc3f7'; ctx.textAlign = 'right';
    ctx.fillText(`🌟 ${STAGES[currentStageIndex].name}`, W-18, 33);

    if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ff1744'; ctx.font = 'bold 72px monospace'; ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', W/2, 210);
        ctx.fillStyle = '#fff'; ctx.font = '28px monospace';
        ctx.fillText('Tekan R untuk restart', W/2, 270);
        ctx.fillStyle = '#888'; ctx.font = '20px monospace';
        ctx.fillText(`Score: ${player.score}`, W/2, 320);
    }

    if (winScreen) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, W, H);
        const pulse = Math.sin(frameCount*0.08)*5;
        ctx.fillStyle = '#ffd700'; ctx.font = 'bold 64px monospace'; ctx.textAlign = 'center';
        ctx.fillText('🎉 STAGE CLEAR! 🎉', W/2, 190+pulse/2);
        ctx.fillStyle = '#fff'; ctx.font = '30px monospace';
        ctx.fillText(`Score: ${player.score}`, W/2, 250);
        const nextStage = currentStageIndex < STAGES.length-1 ? STAGES[currentStageIndex+1].name : '★ FINISH! ★';
        ctx.fillStyle = '#4fc3f7'; ctx.font = '24px monospace';
        ctx.fillText(`Next: ${nextStage}`, W/2, 300);
        if (currentStageIndex >= STAGES.length-1) {
            ctx.fillStyle = '#ffd700'; ctx.font = 'bold 36px monospace';
            ctx.fillText('🏆 YOU WIN THE GAME! 🏆', W/2, 360);
        }
        const progress = (stageTransition % 90) / 90;
        ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fillRect(W/2-200, 340, 400, 10);
        ctx.fillStyle = '#4fc3f7'; ctx.fillRect(W/2-200, 340, 400*progress, 10);
    }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

resetGame();
loop();
</script>
</body>
</html>
