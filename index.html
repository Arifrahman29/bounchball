<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Super Mario Bros - PSP Style</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a2e;font-family:'Courier New',monospace;display:grid;place-items:center;min-height:100vh;overflow:hidden}
#wrap{position:relative;width:min(900px,100vw);padding:10px}
#gameContainer{position:relative;background:#5c94fc;border:6px solid #2a2a4a;border-radius:12px;box-shadow:0 0 30px rgba(92,148,252,0.3),inset 0 0 20px rgba(0,0,0,0.3)}
canvas{display:block;width:100%;image-rendering:pixelated;background:#5c94fc}
#controls{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:8px 16px;background:rgba(26,26,46,0.9);border-radius:8px;border:2px solid #3a3a5a}
#controls kbd{background:#2a2a4a;color:#fff;padding:4px 12px;border-radius:4px;font-size:14px;border:1px solid #4a4a6a}
#controls span{color:#888;font-size:12px}
#status{color:#4fc3f7;font-weight:bold;font-size:14px}
</style>
</head>
<body>
<div id="wrap">
<div id="gameContainer">
<canvas id="game" width="800" height="400"></canvas>
</div>
<div id="controls">
<div>
<kbd>←</kbd> <kbd>→</kbd> <kbd>↑</kbd> <kbd>↓</kbd>
<span style="color:#888;margin:0 8px;">|</span>
<kbd>Z</kbd> Lompat
<span style="color:#888;margin:0 8px;">|</span>
<kbd>R</kbd> Restart
</div>
<div id="status">★ COINS: <span id="coinDisplay">0</span> | SCORE: <span id="scoreDisplay">0</span></div>
</div>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 800, H = 400;

// Keys
const keys = {};
document.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e => {
    keys[e.key.toLowerCase()] = false;
});

// Game constants
const GRAVITY = 0.6;
const FRICTION = 0.85;
const MAX_SPEED = 4.5;

// Level data
const platforms = [
    // Ground
    {x:0, y:360, w:800, h:40, type:'ground'},
    // Floating platforms
    {x:100, y:300, w:80, h:16, type:'brick'},
    {x:220, y:280, w:60, h:16, type:'brick'},
    {x:320, y:320, w:100, h:16, type:'brick'},
    {x:460, y:290, w:60, h:16, type:'brick'},
    {x:560, y:270, w:80, h:16, type:'brick'},
    {x:680, y:310, w:80, h:16, type:'brick'},
    // Question blocks
    {x:150, y:240, w:32, h:32, type:'question', coin:true},
    {x:350, y:260, w:32, h:32, type:'question', coin:true},
    {x:580, y:210, w:32, h:32, type:'question', coin:true},
    // Pipes
    {x:420, y:330, w:40, h:30, type:'pipe'},
    {x:700, y:330, w:40, h:30, type:'pipe'},
];

// Enemies
const enemies = [
    {x:200, y:340, w:28, h:28, vx:1.2, type:'goomba', alive:true},
    {x:500, y:340, w:28, h:28, vx:-1.0, type:'goomba', alive:true},
    {x:650, y:340, w:28, h:28, vx:1.5, type:'goomba', alive:true},
    {x:320, y:290, w:28, h:28, vx:0.8, type:'goomba', alive:true},
];

// Coins
const coins = [
    {x:130, y:340, collected:false},
    {x:170, y:340, collected:false},
    {x:250, y:320, collected:false},
    {x:350, y:360, collected:false},
    {x:490, y:330, collected:false},
    {x:530, y:330, collected:false},
    {x:590, y:310, collected:false},
    {x:630, y:310, collected:false},
    {x:710, y:350, collected:false},
];

// Flag pole
const flag = {x:770, y:300, height:60};

// Player
let player = {
    x: 50,
    y: 340,
    w: 24,
    h: 32,
    vx: 0,
    vy: 0,
    onGround: false,
    facing: 1,
    frame: 0,
    frameTimer: 0,
    lives: 3,
    coins: 0,
    score: 0,
    dead: false,
    win: false,
    invincible: 0
};

// Camera
let camera = {x:0};

// Game state
let gameOver = false;
let winScreen = false;
let frameCount = 0;

function resetGame() {
    player.x = 50;
    player.y = 340;
    player.vx = 0;
    player.vy = 0;
    player.onGround = false;
    player.dead = false;
    player.win = false;
    player.invincible = 0;
    player.coins = 0;
    player.score = 0;
    
    enemies.forEach(e => e.alive = true);
    coins.forEach(c => c.collected = false);
    platforms.forEach(p => {
        if(p.type === 'question') p.coin = true;
    });
    
    gameOver = false;
    winScreen = false;
    camera.x = 0;
    updateUI();
}

function updateUI() {
    document.getElementById('coinDisplay').textContent = player.coins;
    document.getElementById('scoreDisplay').textContent = player.score;
}

function rectCollide(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
}

function update() {
    frameCount++;
    if(gameOver || winScreen) {
        if(keys['r']) resetGame();
        return;
    }
    
    if(player.dead) {
        if(keys['r']) resetGame();
        return;
    }
    
    // Player movement
    let moveX = 0;
    if(keys['arrowleft']) moveX = -1;
    if(keys['arrowright']) moveX = 1;
    
    if(moveX !== 0) {
        player.vx += moveX * 0.5;
        if(Math.abs(player.vx) > MAX_SPEED) {
            player.vx = moveX * MAX_SPEED;
        }
        player.facing = moveX;
    } else {
        player.vx *= FRICTION;
        if(Math.abs(player.vx) < 0.1) player.vx = 0;
    }
    
    // Jump
    if((keys['z'] || keys['arrowup']) && player.onGround) {
        player.vy = -10;
        player.onGround = false;
    }
    
    // Gravity
    player.vy += GRAVITY;
    if(player.vy > 12) player.vy = 12;
    
    // Move X
    player.x += player.vx;
    
    // Collision X
    for(const p of platforms) {
        if(rectCollide(player, p)) {
            if(player.vx > 0) {
                player.x = p.x - player.w;
            } else if(player.vx < 0) {
                player.x = p.x + p.w;
            }
            player.vx = 0;
        }
    }
    
    // Move Y
    player.y += player.vy;
    player.onGround = false;
    
    // Collision Y
    for(const p of platforms) {
        if(rectCollide(player, p)) {
            if(player.vy > 0) {
                player.y = p.y - player.h;
                player.vy = 0;
                player.onGround = true;
                
                // Question block
                if(p.type === 'question' && p.coin) {
                    p.coin = false;
                    player.coins++;
                    player.score += 100;
                    updateUI();
                }
            } else if(player.vy < 0) {
                player.y = p.y + p.h;
                player.vy = 0;
            }
        }
    }
    
    // Collect coins
    for(const c of coins) {
        if(!c.collected && Math.abs(player.x + player.w/2 - c.x) < 20 &&
           Math.abs(player.y + player.h/2 - c.y) < 20) {
            c.collected = true;
            player.coins++;
            player.score += 50;
            updateUI();
        }
    }
    
    // Enemies
    for(const e of enemies) {
        if(!e.alive) continue;
        
        e.x += e.vx;
        
        // Enemy collision with platforms
        let onPlatform = false;
        for(const p of platforms) {
            if(p.type === 'ground' || p.type === 'pipe') {
                if(rectCollide(e, p)) {
                    e.x -= e.vx;
                    e.vx *= -1;
                }
            }
        }
        
        // Player vs enemy
        if(!player.invincible && rectCollide(player, e)) {
            if(player.vy > 0 && player.y + player.h - e.y < 25) {
                // Stomp enemy
                e.alive = false;
                player.vy = -8;
                player.score += 200;
                updateUI();
            } else {
                // Player hit
                player.dead = true;
                player.vy = -10;
                player.lives--;
                updateUI();
                setTimeout(() => {
                    if(player.lives > 0) resetGame();
                    else gameOver = true;
                }, 1000);
            }
        }
    }
    
    // Flag pole
    if(Math.abs(player.x + player.w/2 - flag.x) < 20 &&
       player.y + player.h > flag.y) {
        winScreen = true;
    }
    
    // Fall off screen
    if(player.y > H + 50) {
        player.dead = true;
        player.lives--;
        updateUI();
        setTimeout(() => {
            if(player.lives > 0) resetGame();
            else gameOver = true;
        }, 1000);
    }
    
    // Camera follow
    let targetCam = player.x - 300;
    if(targetCam < 0) targetCam = 0;
    if(targetCam > 400) targetCam = 400;
    camera.x += (targetCam - camera.x) * 0.1;
    
    // Win condition
    if(winScreen) {
        player.score += 1000;
        updateUI();
    }
    
    // Invincibility timer
    if(player.invincible > 0) player.invincible--;
}

function draw() {
    ctx.clearRect(0, 0, W, H);
    
    // Sky gradient
    let skyGrad = ctx.createLinearGradient(0, 0, 0, H);
    skyGrad.addColorStop(0, '#5c94fc');
    skyGrad.addColorStop(0.7, '#88b0ff');
    skyGrad.addColorStop(1, '#aaccff');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);
    
    // Clouds
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    const clouds = [
        {x:50, y:40, s:1.2},
        {x:200, y:25, s:0.8},
        {x:400, y:50, s:1.5},
        {x:600, y:30, s:0.9},
    ];
    for(const c of clouds) {
        const cx = (c.x - camera.x * 0.3) % 900;
        ctx.beginPath();
        ctx.arc(cx - 30*c.s, c.y, 30*c.s, 0, Math.PI*2);
        ctx.arc(cx, c.y - 15*c.s, 35*c.s, 0, Math.PI*2);
        ctx.arc(cx + 30*c.s, c.y, 28*c.s, 0, Math.PI*2);
        ctx.fill();
    }
    
    // Draw platforms with camera offset
    const drawX = (x) => x - camera.x;
    
    for(const p of platforms) {
        const dx = drawX(p.x);
        if(dx > -100 && dx < 900) {
            if(p.type === 'ground') {
                // Grass
                ctx.fillStyle = '#7c9c5c';
                ctx.fillRect(dx, p.y, p.w, 12);
                ctx.fillStyle = '#8a6a4a';
                ctx.fillRect(dx, p.y + 12, p.w, p.h - 12);
                // Grass detail
                ctx.fillStyle = '#6a8a4a';
                for(let i = 0; i < p.w; i += 8) {
                    ctx.fillRect(dx + i, p.y - 1, 2, 4);
                }
            } else if(p.type === 'brick') {
                ctx.fillStyle = '#c67b4a';
                ctx.fillRect(dx, p.y, p.w, p.h);
                ctx.strokeStyle = '#8a5a3a';
                ctx.lineWidth = 1;
                ctx.strokeRect(dx, p.y, p.w, p.h);
                for(let i = 0; i < p.w; i += 16) {
                    ctx.strokeRect(dx + i, p.y, 16, p.h);
                }
            } else if(p.type === 'question') {
                ctx.fillStyle = p.coin ? '#f0c040' : '#8a8a8a';
                ctx.fillRect(dx, p.y, p.w, p.h);
                ctx.strokeStyle = '#c09020';
                ctx.lineWidth = 2;
                ctx.strokeRect(dx, p.y, p.w, p.h);
                if(p.coin) {
                    ctx.fillStyle = '#fff';
                    ctx.font = '20px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('?', dx + 16, p.y + 25);
                }
            } else if(p.type === 'pipe') {
                ctx.fillStyle = '#2a8a2a';
                ctx.fillRect(dx - 4, p.y - 12, p.w + 8, 12);
                ctx.fillRect(dx, p.y, p.w, p.h);
                ctx.fillStyle = '#3aaa3a';
                ctx.fillRect(dx + 4, p.y - 8, p.w - 4, 4);
                ctx.fillRect(dx + 2, p.y + 4, p.w - 4, 4);
            }
        }
    }
    
    // Draw coins
    for(const c of coins) {
        if(!c.collected) {
            const dx = drawX(c.x);
            const glow = Math.sin(frameCount * 0.05) * 2;
            ctx.fillStyle = '#f0c040';
            ctx.shadowColor = '#f0c040';
            ctx.shadowBlur = 15 + glow;
            ctx.beginPath();
            ctx.arc(dx, c.y, 8, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffd700';
            ctx.font = '12px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('$', dx, c.y + 4);
        }
    }
    
    // Draw enemies
    for(const e of enemies) {
        if(!e.alive) continue;
        const dx = drawX(e.x);
        if(dx > -50 && dx < 850) {
            // Goomba body
            ctx.fillStyle = '#8a4a3a';
            ctx.beginPath();
            ctx.arc(dx + 14, e.y + 10, 14, Math.PI, 0);
            ctx.fill();
            ctx.fillRect(dx, e.y + 10, 28, 14);
            // Feet
            ctx.fillStyle = '#4a2a1a';
            const footOff = Math.sin(frameCount * 0.1 + e.x) * 2;
            ctx.fillRect(dx + 2 + footOff, e.y + 22, 10, 6);
            ctx.fillRect(dx + 16 - footOff, e.y + 22, 10, 6);
            // Eyes
            ctx.fillStyle = '#fff';
            ctx.fillRect(dx + 6, e.y + 8, 6, 6);
            ctx.fillRect(dx + 16, e.y + 8, 6, 6);
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(dx + 8 + (e.vx > 0 ? 2 : 0), e.y + 10, 2, 3);
            ctx.fillRect(dx + 18 + (e.vx > 0 ? 2 : 0), e.y + 10, 2, 3);
        }
    }
    
    // Draw flag
    const fdx = drawX(flag.x);
    ctx.fillStyle = '#666';
    ctx.fillRect(fdx, flag.y - 10, 4, flag.height + 10);
    ctx.fillStyle = '#ff4444';
    ctx.beginPath();
    ctx.moveTo(fdx + 4, flag.y - 10);
    ctx.lineTo(fdx + 40, flag.y + 10);
    ctx.lineTo(fdx + 4, flag.y + 30);
    ctx.fill();
    ctx.fillStyle = '#ffd700';
    ctx.font = '12px monospace';
    ctx.fillText('★', fdx + 14, flag.y + 6);
    
    // Draw player
    if(!player.dead && player.invincible % 4 < 2) {
        const dx = drawX(player.x);
        const dy = player.y;
        
        // Body
        ctx.fillStyle = '#e03030';
        ctx.fillRect(dx + 4, dy + 8, 16, 16);
        // Head
        ctx.fillStyle = '#f0c0a0';
        ctx.fillRect(dx + 2, dy, 20, 12);
        // Hat
        ctx.fillStyle = '#e03030';
        ctx.fillRect(dx, dy - 2, 24, 6);
        ctx.fillRect(dx + 4, dy - 6, 16, 4);
        // Mustache
        ctx.fillStyle = '#5a3a2a';
        ctx.fillRect(dx + 4, dy + 8, 16, 3);
        // Eyes
        ctx.fillStyle = '#1a1a1a';
        if(player.facing > 0) {
            ctx.fillRect(dx + 14, dy + 3, 3, 3);
            ctx.fillRect(dx + 18, dy + 3, 3, 3);
        } else {
            ctx.fillRect(dx + 3, dy + 3, 3, 3);
            ctx.fillRect(dx + 7, dy + 3, 3, 3);
        }
        // Shoes
        ctx.fillStyle = '#5a3a1a';
        const walkOff = player.onGround ? Math.sin(frameCount * 0.2) * 2 : 0;
        ctx.fillRect(dx + 2 + walkOff, dy + 24, 8, 6);
        ctx.fillRect(dx + 14 - walkOff, dy + 24, 8, 6);
        // Overall strap
        ctx.fillStyle = '#c02020';
        ctx.fillRect(dx + 4, dy + 12, 3, 8);
        ctx.fillRect(dx + 17, dy + 12, 3, 8);
    }
    
    // UI overlay
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(10, 10, 200, 28);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`❤️ x${player.lives}  🪙 ${player.coins}`, 18, 30);
    
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(W - 160, 10, 150, 28);
    ctx.fillStyle = '#ffd700';
    ctx.textAlign = 'right';
    ctx.fillText(`SCORE: ${player.score}`, W - 18, 30);
    
    // Game over screen
    if(gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ff4444';
        ctx.font = 'bold 60px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', W/2, 180);
        ctx.fillStyle = '#fff';
        ctx.font = '24px monospace';
        ctx.fillText('Tekan R untuk restart', W/2, 240);
    }
    
    // Win screen
    if(winScreen) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 60px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('🎉 YOU WIN! 🎉', W/2, 180);
        ctx.fillStyle = '#fff';
        ctx.font = '24px monospace';
        ctx.fillText(`Score: ${player.score}`, W/2, 230);
        ctx.fillStyle = '#aaa';
        ctx.font = '18px monospace';
        ctx.fillText('Tekan R untuk main lagi', W/2, 280);
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

resetGame();
loop();
</script>
</body>
</html>
