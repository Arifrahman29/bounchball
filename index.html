let gameOver = false;
let winScreen = false;
let frameCount = 0;
let deathTimer = 0;
let stageTransition = 0;
let particles = []; // Untuk efek koin/block

function loadStage(index) {
    const stage = STAGES[index];
    platforms = stage.platforms.map(p => ({...p, used: false}));
    enemies = stage.enemies.map(e => ({
        ...e,
        alive: true,
        vx: (Math.random() > 0.5 ? 1 : -1) * (0.8 + Math.random() * 0.8),
        vy: 0,
        onGround: false,
        startX: e.x
    }));
    coins = stage.coins.map(c => ({...c, collected: false}));
    flag = {...stage.flag};
    
    player = {
        x: 40,
        y: 390,
        w: 28,
        h: 34,
        vx: 0,
        vy: 0,
        onGround: false,
        facing: 1,
        frame: 0,
        frameTimer: 0,
        invincible: 0,
        dead: false,
        big: false,  // Untuk power-up (tidak digunakan di sini)
        score: player.score || 0,
        coins: player.coins || 0,
        lives: player.lives || 3
    };
    
    camera.x = 0;
    gameOver = false;
    winScreen = false;
    deathTimer = 0;
    stageTransition = 0;
    particles = [];
    document.getElementById('stageDisplay').textContent = stage.name;
    updateUI();
}

function resetGame() {
    currentStageIndex = 0;
    player = {
        lives: 3,
        coins: 0,
        score: 0
    };
    loadStage(currentStageIndex);
}

function updateUI() {
    document.getElementById('livesDisplay').textContent = player.lives || 0;
    document.getElementById('coinDisplay').textContent = player.coins || 0;
    document.getElementById('scoreDisplay').textContent = player.score || 0;
}

// ---------- Particle system ----------
function addParticles(x, y, color, count = 8) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 3;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 1,
            life: 30 + Math.random() * 20,
            maxLife: 50,
            size: 3 + Math.random() * 4,
            color: color
        });
    }
}

// ---------- Update ----------
function update() {
    frameCount++;
    
    if (gameOver) {
        if (keys['r']) resetGame();
        return;
    }
    
    if (winScreen) {
        stageTransition++;
        if (stageTransition > 90) {
            currentStageIndex++;
            if (currentStageIndex >= STAGES.length) {
                // Selesai semua stage
                player.score += 10000;
                updateUI();
                // Tampilkan layar kemenangan total
                // Kita akan reset ke stage pertama setelah delay
                setTimeout(() => {
                    resetGame();
                }, 3000);
                return;
            }
            loadStage(currentStageIndex);
        }
        return;
    }
    
    if (player.dead) {
        deathTimer++;
        if (deathTimer > 60) {
            if (player.lives > 0) {
                player.lives--;
                updateUI();
                loadStage(currentStageIndex);
            } else {
                gameOver = true;
            }
        }
        return;
    }
    
    // ---------- Player Input ----------
    let moveX = 0;
    if (keys['arrowleft']) moveX = -1;
    if (keys['arrowright']) moveX = 1;
    
    // Walk
    if (moveX !== 0) {
        player.vx += moveX * 0.55;
        if (Math.abs(player.vx) > MAX_WALK_SPEED) {
            player.vx = moveX * MAX_WALK_SPEED;
        }
        player.facing = moveX;
        // Animasi berjalan
        if (player.onGround) {
            player.frameTimer++;
            if (player.frameTimer > 5) {
                player.frameTimer = 0;
                player.frame = (player.frame + 1) % 4;
            }
        }
    } else {
        player.vx *= FRICTION;
        if (Math.abs(player.vx) < 0.1) player.vx = 0;
        if (player.onGround) {
            player.frame = 0;
            player.frameTimer = 0;
        }
    }
    
    // Jump
    if ((keys['z'] || keys['arrowup']) && player.onGround) {
        player.vy = JUMP_FORCE;
        player.onGround = false;
    }
    // Variable jump height
    if (!keys['z'] && !keys['arrowup'] && player.vy < -2) {
        player.vy *= 0.85;
    }
    
    // Gravity
    player.vy += GRAVITY;
    if (player.vy > MAX_FALL_SPEED) player.vy = MAX_FALL_SPEED;
    
    // ---------- Move X ----------
    player.x += player.vx;
    for (const p of platforms) {
        if (rectCollide(player, p)) {
            if (player.vx > 0) {
                player.x = p.x - player.w;
            } else if (player.vx < 0) {
                player.x = p.x + p.w;
            }
            player.vx = 0;
        }
    }
    
    // ---------- Move Y ----------
    player.y += player.vy;
    player.onGround = false;
    
    for (const p of platforms) {
        if (rectCollide(player, p)) {
            if (player.vy > 0) {
                // Landing on top
                player.y = p.y - player.h;
                player.vy = 0;
                player.onGround = true;
                
                // Question block hit from below? No, dari atas tidak.
            } else if (player.vy < 0) {
                // Hit from below
                player.y = p.y + p.h;
                player.vy = 0;
                // Jika question block
                if (p.type === 'question' && p.coin && !p.used) {
                    p.used = true;
                    p.coin = false;
                    player.coins++;
                    player.score += 200;
                    updateUI();
                    addParticles(p.x + p.w/2, p.y, '#f0c040', 12);
                }
                // Jika brick, hancurkan? (efek visual)
                if (p.type === 'brick') {
                    // Kita tidak menghancurkan brick, tapi beri efek
                    addParticles(p.x + p.w/2, p.y + p.h/2, '#c07a4a', 6);
                }
            }
        }
    }
    
    // ---------- Collect Coins ----------
    for (const c of coins) {
        if (!c.collected) {
            const dx = player.x + player.w/2 - c.x;
            const dy = player.y + player.h/2 - c.y;
            if (Math.hypot(dx, dy) < 22) {
                c.collected = true;
                player.coins++;
                player.score += 100;
                updateUI();
                addParticles(c.x, c.y, '#ffd700', 10);
            }
        }
    }
    
    // ---------- Update Enemies ----------
    for (const e of enemies) {
        if (!e.alive) continue;
        
        e.x += e.vx;
        // Enemy gravity
        e.vy += GRAVITY;
        e.y += e.vy;
        e.onGround = false;
        
        // Collision dengan platform
        for (const p of platforms) {
            if (rectCollide(e, p)) {
                if (e.vy > 0) {
                    e.y = p.y - e.h;
                    e.vy = 0;
                    e.onGround = true;
                } else if (e.vy < 0) {
                    e.y = p.y + p.h;
                    e.vy = 0;
                }
                // Horizontal
                if (e.vx > 0 && e.x + e.w > p.x && e.x < p.x) {
                    e.x = p.x - e.w;
                    e.vx *= -1;
                } else if (e.vx < 0 && e.x < p.x + p.w && e.x + e.w > p.x + p.w) {
                    e.x = p.x + p.w;
                    e.vx *= -1;
                }
            }
        }
        
        // Jika jatuh
        if (e.y > H + 50) e.alive = false;
        
        // Collision dengan player
        if (!player.invincible && !player.dead && rectCollide(player, e)) {
            if (player.vy > 0 && player.y + player.h - e.y < 30) {
                // Stomp
                e.alive = false;
                player.vy = -8;
                player.score += 500;
                updateUI();
                addParticles(e.x + e.w/2, e.y + e.h/2, '#8a4a3a', 12);
            } else {
                // Hit
                player.dead = true;
                player.vy = -8;
                deathTimer = 0;
                player.lives--;
                updateUI();
            }
        }
    }
    
    // ---------- Flag ----------
    if (!player.dead) {
        const dx = player.x + player.w/2 - flag.x;
        const dy = player.y + player.h - flag.y;
        if (Math.abs(dx) < 20 && dy > -10 && dy < 30) {
            winScreen = true;
            player.score += 2000;
            updateUI();
            addParticles(flag.x, flag.y, '#ffd700', 20);
        }
    }
    
    // ---------- Fall off ----------
    if (player.y > H + 50) {
        player.dead = true;
        player.lives--;
        updateUI();
        deathTimer = 0;
    }
    
    // ---------- Camera ----------
    let targetCam = player.x - 400;
    if (targetCam < 0) targetCam = 0;
    if (targetCam > 500) targetCam = 500;
    camera.x += (targetCam - camera.x) * 0.08;
    
    // ---------- Invincibility timer ----------
    if (player.invincible > 0) player.invincible--;
    
    // ---------- Update Particles ----------
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

// ---------- Draw ----------
function draw() {
    ctx.clearRect(0, 0, W, H);
    
    const stage = STAGES[currentStageIndex];
    // Background gradient
    let grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, stage.bgColor1);
    grad.addColorStop(1, stage.bgColor2);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    
    // Clouds (berbeda tiap stage)
    const cloudPositions = [
        {x:100, y:50, s:1.5}, {x:350, y:30, s:1.0}, {x:600, y:60, s:1.8},
        {x:850, y:40, s:1.2}, {x:1100, y:55, s:1.4}, {x:1350, y:35, s:1.1}
    ];
    for (const c of cloudPositions) {
        const cx = (c.x - camera.x * 0.2) % 1800 - 200;
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.beginPath();
        ctx.arc(cx - 30*c.s, c.y, 25*c.s, 0, Math.PI*2);
        ctx.arc(cx, c.y - 15*c.s, 30*c.s, 0, Math.PI*2);
        ctx.arc(cx + 30*c.s, c.y, 25*c.s, 0, Math.PI*2);
        ctx.fill();
    }
    
    const drawX = (x) => x - camera.x;
    
    // ---------- Draw Platforms ----------
    for (const p of platforms) {
        const dx = drawX(p.x);
        if (dx < -100 || dx > 1000) continue;
        
        if (p.type === 'ground') {
            ctx.fillStyle = '#6aaa4a';
            ctx.fillRect(dx, p.y, p.w, 8);
            ctx.fillStyle = '#8a7a5a';
            ctx.fillRect(dx, p.y+8, p.w, p.h-8);
            // Rumput
            ctx.fillStyle = '#5a9a3a';
            for (let i=0; i<p.w; i+=6) {
                ctx.fillRect(dx+i, p.y-2, 2, 4);
            }
        } else if (p.type === 'brick') {
            ctx.fillStyle = '#c07a4a';
            ctx.fillRect(dx, p.y, p.w, p.h);
            ctx.strokeStyle = '#8a5a3a';
            ctx.lineWidth = 1;
            ctx.strokeRect(dx, p.y, p.w, p.h);
            // Pola bata
            for (let i=0; i<p.w; i+=p.w/2) {
                ctx.strokeRect(dx+i, p.y, p.w/2, p.h/2);
                ctx.strokeRect(dx+i - p.w/4, p.y+p.h/2, p.w/2, p.h/2);
            }
        } else if (p.type === 'question') {
            const isCoin = p.coin && !p.used;
            ctx.fillStyle = isCoin ? '#f0c040' : '#8a8a8a';
            ctx.fillRect(dx, p.y, p.w, p.h);
            ctx.strokeStyle = isCoin ? '#c09020' : '#666';
            ctx.lineWidth = 2;
            ctx.strokeRect(dx, p.y, p.w, p.h);
            if (isCoin) {
                const pulse = Math.sin(frameCount * 0.08) * 2;
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 20px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('?', dx+p.w/2, p.y+p.h/2+7+pulse/2);
            }
        } else if (p.type === 'platform') {
            ctx.fillStyle = '#8a7a5a';
            ctx.fillRect(dx, p.y, p.w, p.h);
            ctx.fillStyle = '#6a5a3a';
            ctx.fillRect(dx, p.y, p.w, 2);
            ctx.fillRect(dx, p.y+p.h-2, p.w, 2);
        } else if (p.type === 'pipe') {
            // Pipa
            ctx.fillStyle = '#2a8a2a';
            ctx.fillRect(dx-2, p.y-10, p.w+4, 10);
            ctx.fillRect(dx, p.y, p.w, p.h);
            ctx.fillStyle = '#3aaa3a';
            ctx.fillRect(dx+4, p.y-6, p.w-12, 3);
            ctx.fillRect(dx+3, p.y+4, p.w-8, 3);
            ctx.fillRect(dx+3, p.y+p.h-8, p.w-8, 3);
        }
    }
    
    // ---------- Draw Coins ----------
    for (const c of coins) {
        if (c.collected) continue;
        const dx = drawX(c.x);
        const scale = Math.abs(Math.sin(frameCount * 0.06 + c.x));
        ctx.shadowColor = '#f0c040';
        ctx.shadowBlur = 20;
        ctx.fillStyle = '#f0c040';
        ctx.beginPath();
        ctx.ellipse(dx, c.y, 8*scale+2, 8, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffd700';
        ctx.beginPath();
        ctx.ellipse(dx, c.y, 4*scale+1, 4, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }
    
    // ---------- Draw Enemies ----------
    for (const e of enemies) {
        if (!e.alive) continue;
        const dx = drawX(e.x);
        if (dx < -50 || dx > 1000) continue;
        // Goomba
        ctx.fillStyle = '#8a4a3a';
        ctx.beginPath();
        ctx.arc(dx+14, e.y+10, 14, Math.PI, 0);
        ctx.fill();
        ctx.fillRect(dx, e.y+10, 28, 14);
        ctx.fillStyle = '#4a2a1a';
        const footOff = Math.sin(frameCount*0.12 + e.x) * 3;
        ctx.fillRect(dx+2+footOff, e.y+22, 10, 6);
        ctx.fillRect(dx+16-footOff, e.y+22, 10, 6);
        // Mata
        ctx.fillStyle = '#fff';
        ctx.fillRect(dx+6, e.y+8, 6, 6);
        ctx.fillRect(dx+16, e.y+8, 6, 6);
        ctx.fillStyle = '#1a1a1a';
        const eyeDir = e.vx > 0 ? 2 : 0;
        ctx.fillRect(dx+8+eyeDir, e.y+10, 2, 3);
        ctx.fillRect(dx+18+eyeDir, e.y+10, 2, 3);
        // Alis
        ctx.fillStyle = '#3a2a1a';
        ctx.fillRect(dx+5, e.y+6, 8, 2);
        ctx.fillRect(dx+15, e.y+6, 8, 2);
    }
    
    // ---------- Draw Flag ----------
    const fdx = drawX(flag.x);
    ctx.fillStyle = '#888';
    ctx.fillRect(fdx, flag.y-10, 4, flag.height+10);
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.arc(fdx+2, flag.y-10, 6, 0, Math.PI*2);
    ctx.fill();
    // Bendera
    const wave = Math.sin(frameCount*0.08)*3;
    ctx.fillStyle = '#ff4444';
    ctx.beginPath();
    ctx.moveTo(fdx+4, flag.y-8);
    ctx.quadraticCurveTo(fdx+25+wave, flag.y+5, fdx+4, flag.y+20);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('★', fdx+14+wave/2, flag.y+8);
    // Tiang
    ctx.fillStyle = '#666';
    ctx.fillRect(fdx-4, flag.y+flag.height-4, 12, 8);
    
    // ---------- Draw Player ----------
    if (!player.dead && player.invincible % 4 < 2) {
        const dx = drawX(player.x);
        const dy = player.y;
        ctx.save();
        ctx.translate(dx + player.w/2, dy + player.h/2);
        if (player.facing < 0) ctx.scale(-1, 1);
        
        // Bayangan
        ctx.shadowColor = 'rgba(0,0,0,0.2)';
        ctx.shadowBlur = 10;
        ctx.shadowOffsetY = 3;
        
        // Topi
        ctx.fillStyle = '#e03030';
        ctx.fillRect(-14, -20, 28, 6);
        ctx.fillRect(-10, -24, 20, 5);
        ctx.fillRect(-15, -17, 30, 3);
        // Wajah
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#f0c0a0';
        ctx.fillRect(-12, -14, 24, 14);
        // Samping rambut
        ctx.fillStyle = '#5a3a1a';
        ctx.fillRect(-14, -16, 4, 10);
        ctx.fillRect(10, -16, 4, 10);
        // Kumis
        ctx.fillStyle = '#5a3a1a';
        ctx.fillRect(-10, -6, 20, 3);
        ctx.fillRect(-13, -6, 4, 4);
        ctx.fillRect(9, -6, 4, 4);
        // Mata
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(-5, -10, 3, 3);
        ctx.fillRect(2, -10, 3, 3);
        ctx.fillStyle = '#fff';
        ctx.fillRect(-4, -10, 1, 1);
        ctx.fillRect(3, -10, 1, 1);
        // Badan (overall)
        ctx.fillStyle = '#e03030';
        ctx.fillRect(-12, 2, 24, 14);
        ctx.fillStyle = '#c02020';
        ctx.fillRect(-10, -2, 4, 8);
        ctx.fillRect(6, -2, 4, 8);
        ctx.fillStyle = '#ffd700';
        ctx.fillRect(-9, 2, 2, 2);
        ctx.fillRect(7, 2, 2, 2);
        // Sepatu
        ctx.fillStyle = '#5a3a1a';
        const walkOff = player.onGround ? Math.sin(frameCount*0.15 + (player.facing>0?0:1))*2 : 0;
        ctx.fillRect(-12+walkOff, 16, 10, 6);
        ctx.fillRect(2-walkOff, 16, 10, 6);
        ctx.fillStyle = '#4a2a0a';
        ctx.fillRect(-12+walkOff, 18, 10, 2);
        ctx.fillRect(2-walkOff, 18, 10, 2);
        
        ctx.restore();
    }
    
    // ---------- Particles ----------
    for (const p of particles) {
        const alpha = p.life / p.maxLife;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - camera.x, p.y, p.size, p.size);
    }
    ctx.globalAlpha = 1;
    
    // ---------- HUD ----------
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(10, 10, 160, 30);
    ctx.fillRect(180, 10, 120, 30);
    ctx.fillRect(310, 10, 200, 30);
    ctx.fillRect(W-100, 10, 90, 30);
    
    ctx.fillStyle = '#ff6b6b';
    ctx.font = '20px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`❤️ x${player.lives}`, 18, 33);
    ctx.fillStyle = '#ffd700';
    ctx.fillText(`🪙 ${player.coins}`, 188, 33);
    ctx.fillStyle = '#fff';
    ctx.fillText(`🏆 ${player.score}`, 318, 33);
    ctx.fillStyle = '#4fc3f7';
    ctx.textAlign = 'right';
    ctx.fillText(`🌟 ${STAGES[currentStageIndex].name}`, W-18, 33);
    
    // ---------- Game Over ----------
    if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.85)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ff1744';
        ctx.font = 'bold 72px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', W/2, 210);
        ctx.fillStyle = '#fff';
        ctx.font = '28px monospace';
        ctx.fillText('Tekan R untuk restart', W/2, 270);
        ctx.fillStyle = '#888';
        ctx.font = '20px monospace';
        ctx.fillText(`Score: ${player.score}`, W/2, 320);
    }
    
    // ---------- Win Screen ----------
    if (winScreen) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);
        const pulse = Math.sin(frameCount*0.08)*5;
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 64px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('🎉 STAGE CLEAR! 🎉', W/2, 190+pulse/2);
        ctx.fillStyle = '#fff';
        ctx.font = '30px monospace';
        ctx.fillText(`Score: ${player.score}`, W/2, 250);
        const nextStage = currentStageIndex < STAGES.length-1 ? 
            STAGES[currentStageIndex+1].name : '★ FINISH! ★';
        ctx.fillStyle = '#4fc3f7';
        ctx.font = '24px monospace';
        ctx.fillText(`Next: ${nextStage}`, W/2, 300);
        if (currentStageIndex >= STAGES.length-1) {
            ctx.fillStyle = '#ffd700';
            ctx.font = 'bold 36px monospace';
            ctx.fillText('🏆 YOU WIN THE GAME! 🏆', W/2, 360);
        }
        // Progress bar
        const progress = (stageTransition % 90) / 90;
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(W/2-200, 340, 400, 10);
        ctx.fillStyle = '#4fc3f7';
        ctx.fillRect(W/2-200, 340, 400*progress, 10);
    }
}

// ---------- Main Loop ----------
function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

// ---------- Start ----------
resetGame();
loop();
</script>
