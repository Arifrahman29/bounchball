<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nokia Snake Classic</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #151515;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

.phone {
    width: 390px;
    background: #b7b7b7;
    border-radius: 35px 35px 45px 45px;
    padding: 28px 25px 35px;
    box-shadow:
        inset 0 0 0 4px #777,
        0 15px 40px rgba(0,0,0,.7);
}

/* LOGO */
.logo {
    text-align: center;
    font-weight: bold;
    font-size: 27px;
    letter-spacing: 3px;
    color: #303030;
    margin-bottom: 20px;
}

/* LCD */
.screen {
    background: #9baa70;
    border: 10px solid #383838;
    border-radius: 8px;
    padding: 8px;
    box-shadow:
        inset 0 0 10px rgba(0,0,0,.35),
        0 3px 5px rgba(0,0,0,.4);
}

.info {
    display: flex;
    justify-content: space-between;
    color: #26351a;
    font-size: 13px;
    font-weight: bold;
    height: 20px;
}

canvas {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    image-rendering: pixelated;
    background: #a9b77a;
}

/* GAME MESSAGE */
.message {
    position: absolute;
    width: 302px;
    margin-top: -205px;
    text-align: center;
    color: #26351a;
    font-weight: bold;
    pointer-events: none;
}

.message .title {
    font-size: 20px;
    margin-bottom: 8px;
}

.message .small {
    font-size: 12px;
}

/* KEYPAD */
.keypad {
    margin-top: 25px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
}

.row {
    display: flex;
    gap: 8px;
}

.key {
    width: 58px;
    height: 42px;
    border-radius: 12px;
    border: 2px solid #666;
    background: linear-gradient(#eeeeee, #aaa);
    box-shadow:
        0 4px 0 #777,
        0 6px 8px rgba(0,0,0,.3);
    font-size: 18px;
    font-weight: bold;
    color: #333;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
}

.key:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 #777;
}

.center {
    width: 75px;
    height: 45px;
    border-radius: 18px;
    background: linear-gradient(#444, #222);
    color: #ddd;
    font-size: 11px;
}

/* EXTRA BUTTONS */
.buttons {
    display: flex;
    justify-content: space-between;
    margin-top: 18px;
    padding: 0 25px;
}

.small-key {
    width: 75px;
    height: 30px;
    border-radius: 15px;
    background: #333;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 10px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="phone">

    <div class="logo">NOKIA</div>

    <div class="screen">

        <div class="info">
            <span>SCORE: <span id="score">0</span></span>
            <span>HI: <span id="high">0</span></span>
        </div>

        <canvas id="game" width="240" height="240"></canvas>

    </div>

    <div class="keypad">

        <div class="row">
            <div class="key" data-key="ArrowUp">▲</div>
        </div>

        <div class="row">
            <div class="key" data-key="ArrowLeft">◀</div>
            <div class="key center">OK</div>
            <div class="key" data-key="ArrowRight">▶</div>
        </div>

        <div class="row">
            <div class="key" data-key="ArrowDown">▼</div>
        </div>

    </div>

    <div class="buttons">
        <div class="small-key">MENU</div>
        <div class="small-key">EXIT</div>
    </div>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const highEl = document.getElementById("high");

const SIZE = 12;
const GRID = canvas.width / SIZE;

let snake;
let food;
let direction;
let nextDirection;

let score = 0;
let highScore = Number(localStorage.getItem("snakeHighScore")) || 0;

let gameOver = false;
let paused = false;

let speed = 130;
let timer;

highEl.textContent = highScore;


/* =========================
   START GAME
========================= */

function startGame() {

    snake = [
        {x: 10, y: 10},
        {x: 9, y: 10},
        {x: 8, y: 10}
    ];

    direction = {
        x: 1,
        y: 0
    };

    nextDirection = {
        x: 1,
        y: 0
    };

    score = 0;
    speed = 130;

    gameOver = false;
    paused = false;

    scoreEl.textContent = score;

    createFood();

    clearInterval(timer);
    timer = setInterval(gameLoop, speed);

    draw();
}


/* =========================
   FOOD
========================= */

function createFood() {

    do {

        food = {
            x: Math.floor(Math.random() * GRID),
            y: Math.floor(Math.random() * GRID)
        };

    } while (
        snake.some(part =>
            part.x === food.x &&
            part.y === food.y
        )
    );
}


/* =========================
   GAME LOOP
========================= */

function gameLoop() {

    if (gameOver || paused) {
        draw();
        return;
    }

    direction = nextDirection;

    const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
    };


    /* WALL COLLISION */

    if (
        head.x < 0 ||
        head.x >= GRID ||
        head.y < 0 ||
        head.y >= GRID
    ) {
        endGame();
        return;
    }


    /* SELF COLLISION */

    if (
        snake.some(part =>
            part.x === head.x &&
            part.y === head.y
        )
    ) {
        endGame();
        return;
    }


    snake.unshift(head);


    /* EAT FOOD */

    if (
        head.x === food.x &&
        head.y === food.y
    ) {

        score++;

        scoreEl.textContent = score;

        if (score > highScore) {

            highScore = score;

            localStorage.setItem(
                "snakeHighScore",
                highScore
            );

            highEl.textContent = highScore;
        }

        createFood();

        /*
        Semakin tinggi score,
        semakin cepat ular.
        */

        if (speed > 55) {

            speed -= 3;

            clearInterval(timer);

            timer = setInterval(
                gameLoop,
                speed
            );
        }

    } else {

        snake.pop();

    }

    draw();
}


/* =========================
   DRAW
========================= */

function draw() {

    ctx.fillStyle = "#a9b77a";
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* PIXEL GRID */

    ctx.strokeStyle =
        "rgba(45,60,30,.08)";

    ctx.lineWidth = 1;

    for (let i = 0; i <= GRID; i++) {

        ctx.beginPath();

        ctx.moveTo(i * SIZE, 0);
        ctx.lineTo(
            i * SIZE,
            canvas.height
        );

        ctx.stroke();

        ctx.beginPath();

        ctx.moveTo(0, i * SIZE);
        ctx.lineTo(
            canvas.width,
            i * SIZE
        );

        ctx.stroke();
    }


    /* FOOD */

    ctx.fillStyle = "#26351a";

    ctx.fillRect(
        food.x * SIZE + 2,
        food.y * SIZE + 2,
        SIZE - 4,
        SIZE - 4
    );


    /* SNAKE */

    snake.forEach((part, index) => {

        ctx.fillStyle = "#26351a";

        if (index === 0) {

            ctx.fillRect(
                part.x * SIZE,
                part.y * SIZE,
                SIZE,
                SIZE
            );

            /*
            Mata ular dibuat sedikit
            seperti pixel Nokia.
            */

            ctx.fillStyle = "#a9b77a";

            if (direction.x !== 0) {

                ctx.fillRect(
                    part.x * SIZE +
                    (direction.x > 0 ? 8 : 2),
                    part.y * SIZE + 3,
                    2,
                    2
                );

                ctx.fillRect(
                    part.x * SIZE +
                    (direction.x > 0 ? 8 : 2),
                    part.y * SIZE + 7,
                    2,
                    2
                );

            } else {

                ctx.fillRect(
                    part.x * SIZE + 3,
                    part.y * SIZE +
                    (direction.y > 0 ? 8 : 2),
                    2,
                    2
                );

                ctx.fillRect(
                    part.x * SIZE + 7,
                    part.y * SIZE +
                    (direction.y > 0 ? 8 : 2),
                    2,
                    2
                );
            }

        } else {

            ctx.fillRect(
                part.x * SIZE + 1,
                part.y * SIZE + 1,
                SIZE - 2,
                SIZE - 2
            );
        }

    });


    /* GAME OVER */

    if (gameOver) {

        ctx.fillStyle =
            "rgba(169,183,122,.88)";

        ctx.fillRect(
            20,
            85,
            200,
            70
        );

        ctx.fillStyle = "#26351a";

        ctx.textAlign = "center";

        ctx.font = "bold 20px monospace";

        ctx.fillText(
            "GAME OVER",
            canvas.width / 2,
            112
        );

        ctx.font = "bold 11px monospace";

        ctx.fillText(
            "PRESS ENTER",
            canvas.width / 2,
            135
        );

        ctx.fillText(
            "SCORE: " + score,
            canvas.width / 2,
            150
        );
    }


    /* PAUSE */

    if (paused && !gameOver) {

        ctx.fillStyle =
            "rgba(169,183,122,.88)";

        ctx.fillRect(
            40,
            90,
            160,
            60
        );

        ctx.fillStyle = "#26351a";

        ctx.textAlign = "center";

        ctx.font = "bold 20px monospace";

        ctx.fillText(
            "PAUSED",
            canvas.width / 2,
            118
        );

        ctx.font = "bold 10px monospace";

        ctx.fillText(
            "PRESS P",
            canvas.width / 2,
            137
        );
    }
}


/* =========================
   GAME OVER
========================= */

function endGame() {

    gameOver = true;

    clearInterval(timer);

    draw();
}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(e) {

        const key = e.key;


        /* RESTART */

        if (
            key === "Enter" &&
            gameOver
        ) {

            startGame();
            return;
        }


        /* PAUSE */

        if (
            key.toLowerCase() === "p"
        ) {

            if (!gameOver) {

                paused = !paused;

                draw();
            }

            return;
        }


        if (gameOver || paused)
            return;


        /* PREVENT PAGE SCROLL */

        if (
            [
                "ArrowUp",
                "ArrowDown",
                "ArrowLeft",
                "ArrowRight"
            ].includes(key)
        ) {

            e.preventDefault();
        }


        changeDirection(key);

    }
);


/* =========================
   DIRECTION
========================= */

function changeDirection(key) {

    if (
        key === "ArrowUp" &&
        direction.y !== 1
    ) {

        nextDirection = {
            x: 0,
            y: -1
        };

    }

    else if (
        key === "ArrowDown" &&
        direction.y !== -1
    ) {

        nextDirection = {
            x: 0,
            y: 1
        };

    }

    else if (
        key === "ArrowLeft" &&
        direction.x !== 1
    ) {

        nextDirection = {
            x: -1,
            y: 0
        };

    }

    else if (
        key === "ArrowRight" &&
        direction.x !== -1
    ) {

        nextDirection = {
            x: 1,
            y: 0
        };

    }
}


/* =========================
   ON-SCREEN BUTTONS
========================= */

document.querySelectorAll(".key[data-key]")
.forEach(button => {

    button.addEventListener(
        "click",
        function() {

            if (
                gameOver ||
                paused
            ) return;

            changeDirection(
                button.dataset.key
            );
        }
    );

});


/* =========================
   START
========================= */

startGame();

</script>

</body>
</html>
